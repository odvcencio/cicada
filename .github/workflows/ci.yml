name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicada-ci-${{ github.ref }}-${{ github.event_name }}
  # A newer push to a pull request cancels its older run. Runs on main finish,
  # so a merge is not left without a result when the next merge lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-hygiene:
    name: Commit metadata hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every pull request commit
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-commit-hygiene.sh "$PR_BASE_SHA" "$PR_HEAD_SHA"

  parity-amd64:
    name: PCM24 parity (amd64, WASM)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'false'
      - name: Render all examples with amd64 and WASM
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = amd64
          make test-parity
      - name: Save amd64 PCM and the tested kernel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: parity-amd64
          if-no-files-found: error
          retention-days: 7
          path: |
            build/cicada-kernel.wasm
            build/parity/*.pcm24
            build/parity/report.txt

  parity-arm64:
    name: PCM24 parity (amd64, arm64, WASM)
    needs: parity-amd64
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      GOWORK: off
    steps:
      - name: Require the amd64 parity gate to pass
        env:
          AMD64_PARITY_RESULT: ${{ needs.parity-amd64.result }}
        run: test "$AMD64_PARITY_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: parity-amd64
          path: build/amd64-reference
      - name: Require identical amd64, arm64, and WASM PCM24
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = arm64
          mkdir -p build/parity
          CICADA_WASM_PATH="$PWD/build/amd64-reference/cicada-kernel.wasm" \
          CICADA_PARITY_REFERENCE="$PWD/build/amd64-reference/parity" \
          CICADA_PARITY_DIR="$PWD/build/parity" \
          go test -timeout=20m -tags wasm_integration ./cmd/cicada-kernel-wasm \
            -run '^TestExamplesPCM24Parity$' -count=1 -v | tee build/parity/report.txt
      - name: Save arm64 parity report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: parity-arm64-report
          if-no-files-found: warn
          path: build/parity/report.txt

  m0:
    name: M0 language and kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'false'
      - name: Tool versions
        run: |
          go version
          tinygo version
      - name: Grammar and Go
        run: |
          set -euo pipefail
          make grammar-check
          make test
          make test-kernel
          go vet ./...
          make test-golden | tee build/golden-report.txt
          make test-alloc test-timing | tee build/realtime-report.txt
      - name: Audio WASM and size gate
        run: |
          set -euo pipefail
          make probe-wasm
          make test-kernel-wasm | tee build/kernel-wasm-report.txt
          make test-sampler-wasm | tee build/sampler-wasm-report.txt
          make test-keys-wasm | tee build/keys-wasm-report.txt
      - name: Native acid benchmark
        run: |
          set -euo pipefail
          GOMAXPROCS=1 go test ./kernel/voice/acid -run '^$' -bench '^BenchmarkAcidNext' -benchmem -benchtime=1s -count=5 | tee build/acid-bench-report.txt
      - name: M0 CLI acceptance
        run: |
          set -euo pipefail
          make build-core
          {
            ./build/cicada validate examples/first-acid.cicada
            ./build/cicada render examples/first-acid.cicada -o build/first-acid.wav --rate 48000 --bits 24 --bars 16 --tail 3s
            ./build/cicada verify-wav build/first-acid.wav --rate 48000 --bits 24 --bars 16 --tail 3s --peak-max-db -0.3 --dc-max-db -60
            ./build/cicada fmt --check examples/first-acid.cicada
            ./build/cicada convert examples/first-acid.cicada -o build/first-acid.cicada.json
            ./build/cicada convert build/first-acid.cicada.json -o build/first-acid-roundtrip.cicada
            ./build/cicada compare --semantic examples/first-acid.cicada build/first-acid-roundtrip.cicada
          } | tee build/m0-cli-report.txt
      - name: M1 generator and export acceptance
        run: |
          set -euo pipefail
          mkdir -p build/m1-ci
          make test-phrase-wasm | tee build/m1-phrase-wasm-report.txt
          ./build/cicada gen --seed 4242 --key a --scale minor --trace -o build/m1-ci/generated.cicada > build/m1-ci/generated.trace.json
          {
            ./build/cicada validate build/m1-ci/generated.cicada
            ./build/cicada render examples/first-acid.cicada -o build/m1-ci/first-acid-lufs.wav --rate 48000 --bits 24 --bars 16 --tail 3s --loudness -14 && ./build/cicada verify-wav build/m1-ci/first-acid-lufs.wav --rate 48000 --bits 24 --bars 16 --tail 3s --lufs -14 --lufs-tolerance 0.5 --true-peak-max -1
            ./build/cicada stems examples/fx-bus.cicada -o build/m1-ci/stems
            ./build/cicada verify-stems build/m1-ci/stems --tap pre-comp --residual-max-db -80
            ./build/cicada midi examples/first-acid.cicada -o build/m1-ci/first-acid.mid
            ./build/cicada verify-midi build/m1-ci/first-acid.mid --ppq 960 --type 1
          } | tee build/m1-cli-report.txt
      - name: Save gate reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m0-m1-gate-reports
          if-no-files-found: error
          path: |
            build/grammar-doctor.txt
            build/golden-report.txt
            build/realtime-report.txt
            build/kernel-wasm-report.txt
            build/sampler-wasm-report.txt
            build/keys-wasm-report.txt
            build/cicada-loudness.wasm
            build/acid-bench-report.txt
            build/m0-cli-report.txt
            build/m1-phrase-wasm-report.txt
            build/m1-cli-report.txt
            build/m1-ci/generated.cicada
            build/m1-ci/generated.trace.json
            build/m1-ci/first-acid.mid
            build/first-acid.wav

  workstation:
    name: GoSX workstation and Tymbal boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOWORK: off
      CHROME_VERSION: 152.0.7977.64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.4'
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'false'
      - name: Supported Node for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Framework generation, race checks, and production bundle
        run: |
          set -euo pipefail
          make test-workstation
          (cd workstation && go vet ./...)
          make build-workstation-release
          git diff --exit-code -- workstation/ui
      - name: Windows workstation and desktop
        run: |
          set -euo pipefail
          (cd workstation && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o ../build/cicada-workstation.exe .)
          (cd desktop && go test ./... && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o ../build/cicada-studio.exe .)
      - name: Studio browser continuity
        shell: bash
        run: |
          set -euo pipefail
          browser_root="$RUNNER_TEMP/cicada-studio-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$browser_root"
          npm install --prefix "$browser_root" --no-save --ignore-scripts playwright@1.62.1
          export CICADA_PLAYWRIGHT_MODULE="$browser_root/node_modules/playwright"
          tool_root="$RUNNER_TOOL_CACHE/chrome-for-testing/$CHROME_VERSION/linux64"
          export CICADA_CHROME_PATH="$tool_root/chrome-headless-shell-linux64/chrome-headless-shell"
          if [[ ! -x "$CICADA_CHROME_PATH" ]]; then
            mkdir -p "$tool_root"
            curl --fail --location --retry 3 --output "$browser_root/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip"
            unzip -q "$browser_root/chrome.zip" -d "$browser_root"
            mv "$browser_root/chrome-headless-shell-linux64" "$tool_root/"
          fi
          node workstation/browser/continuity.test.cjs --write-fixture "$browser_root/continuity.cicada"
          make build-core
          studio_port="$(node -e 'const server=require("node:net").createServer(); server.listen(0,"127.0.0.1",()=>{process.stdout.write(String(server.address().port));server.close()})')"
          export CICADA_STUDIO_URL="http://127.0.0.1:$studio_port"
          ./build/cicada studio "$browser_root/continuity.cicada" --audio null --listen "127.0.0.1:$studio_port" > build/studio-continuity-server.log 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid" 2>/dev/null || true; wait "$studio_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if curl --silent --fail "$CICADA_STUDIO_URL/" > /dev/null; then break; fi
            kill -0 "$studio_pid"
            sleep 0.1
          done
          make test-studio-continuity | tee build/studio-continuity-report.txt
          # Use a new Studio process so its first authenticated session owns it.
          kill "$studio_pid"
          wait "$studio_pid" || true
          ./build/cicada studio "$browser_root/continuity.cicada" --audio null --listen "127.0.0.1:$studio_port" > build/studio-collaboration-server.log 2>&1 &
          studio_pid=$!
          for attempt in $(seq 1 100); do
            if curl --silent --fail "$CICADA_STUDIO_URL/" > /dev/null; then break; fi
            kill -0 "$studio_pid"
            sleep 0.1
          done
          make test-studio-collaboration | tee build/studio-collaboration-report.txt
      - name: Save Studio continuity reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: studio-continuity-reports
          if-no-files-found: warn
          path: |
            build/studio-continuity-report.txt
            build/studio-continuity-server.log
            build/studio-collaboration-report.txt
            build/studio-collaboration-server.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gosx-workstation-build
          path: workstation/dist/build.json

  m2-pr:
    name: M2 AudioWorklet gates
    # This job runs on the self-hosted reference machine, so a pull request from
    # a fork must not run it.
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 40
    env:
      GOWORK: off
      CHROME_VERSION: 152.0.7977.64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'false'
      - name: Cache pinned Chrome for Testing headless shell
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TOOL_CACHE/chrome-for-testing/$CHROME_VERSION/linux64"
          browser_path="$tool_root/chrome-headless-shell-linux64/chrome-headless-shell"
          if [[ ! -x "$browser_path" ]]; then
            mkdir -p "$tool_root"
            temp_dir="$(mktemp -d "$RUNNER_TEMP/chrome-for-testing.XXXXXX")"
            trap 'rm -rf "$temp_dir"' EXIT
            archive="$temp_dir/chrome-headless-shell.zip"
            curl --fail --location --retry 3 --output "$archive" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip"
            unzip -q "$archive" -d "$temp_dir"
            mv "$temp_dir/chrome-headless-shell-linux64" "$tool_root/"
          fi
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
          PULSE_SERVER=unix:/nonexistent "$browser_path" --mute-audio --version
          go version
          tinygo version
          node --version
      - name: M2 parity, browser, and budgets
        run: make test-wasm test-chord-wasm test-browser test-demo-browser budget-size budget-browser
      - name: WAM2 export and reference host
        env:
          CICADA_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/cicada-wam2-evidence
        run: make test-wam2
      - name: Save WAM2 GUI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wam2-gui-evidence
          if-no-files-found: error
          path: ${{ runner.temp }}/cicada-wam2-evidence/*.png
      - name: Save M2 gate reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m2-audioworklet-gate-reports
          if-no-files-found: warn
          path: |
            build/test-wasm.log
            build/test-chord-wasm.log
            build/chord-wasm-report.txt
            build/test-browser.log
            build/budget-size-report.txt
            build/budget-browser.log
            build/browser-cpu-report.json
            build/m2-browser-chrome.log
            build/demo-evidence/

  m2-soak:
    name: M2 AudioWorklet nightly soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Its CPU gate (0.67 ms per callback) is measured on the reference machine.
    # A hosted runner measured 1.296 ms, so this job stays on the self-hosted one.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 55
    env:
      GOWORK: off
      CHROME_VERSION: 152.0.7977.64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'false'
      - name: Cache pinned Chrome for Testing headless shell
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TOOL_CACHE/chrome-for-testing/$CHROME_VERSION/linux64"
          browser_path="$tool_root/chrome-headless-shell-linux64/chrome-headless-shell"
          if [[ ! -x "$browser_path" ]]; then
            mkdir -p "$tool_root"
            temp_dir="$(mktemp -d "$RUNNER_TEMP/chrome-for-testing.XXXXXX")"
            trap 'rm -rf "$temp_dir"' EXIT
            archive="$temp_dir/chrome-headless-shell.zip"
            curl --fail --location --retry 3 --output "$archive" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip"
            unzip -q "$archive" -d "$temp_dir"
            mv "$temp_dir/chrome-headless-shell-linux64" "$tool_root/"
          fi
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
          PULSE_SERVER=unix:/nonexistent "$browser_path" --mute-audio --version
          go version
          tinygo version
          node --version
      - name: Run full 30-minute browser soak
        run: make test-browser-soak
      - name: Save M2 soak report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m2-audioworklet-soak-report
          if-no-files-found: warn
          path: |
            build/browser-soak.log
            build/browser-soak-report.json
            build/demo-soak-report.json
            build/demo-evidence/
            build/browser-cpu-report.json
            build/m2-browser-chrome.log
