name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cicada-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m0:
    name: M0 language and kernel
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, buildbox, linux, x64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'false'
      - name: Tool versions
        run: |
          go version
          tinygo version
      - name: Grammar and Go
        run: |
          make grammar-check
          go test ./... -count=1
          go vet ./...
          make test-golden
          make test-alloc test-timing
      - name: Audio WASM and size gate
        run: make test-kernel-wasm
