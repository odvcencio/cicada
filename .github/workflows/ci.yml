name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicada-ci-${{ github.ref }}-${{ github.event_name }}
  # A newer push to a pull request cancels its older run. Runs on main finish,
  # so a merge is not left without a result when the next merge lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-hygiene:
    name: Commit metadata hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every pull request commit
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-commit-hygiene.sh "$PR_BASE_SHA" "$PR_HEAD_SHA"

  parity-amd64:
    name: PCM24 parity (amd64, WASM)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'false'
      - name: Render all examples with amd64 and WASM
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = amd64
          make test-parity
      - name: Save amd64 PCM and the tested kernel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: parity-amd64
          if-no-files-found: error
          retention-days: 7
          path: |
            build/cicada-kernel.wasm
            build/parity/*.pcm24
            build/parity/report.txt

  parity-arm64:
    name: PCM24 parity (amd64, arm64, WASM)
    needs: parity-amd64
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      GOWORK: off
    steps:
      - name: Require the amd64 parity gate to pass
        env:
          AMD64_PARITY_RESULT: ${{ needs.parity-amd64.result }}
        run: test "$AMD64_PARITY_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: parity-amd64
          path: build/amd64-reference
      - name: Require identical amd64, arm64, and WASM PCM24
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = arm64
          mkdir -p build/parity
          CICADA_WASM_PATH="$PWD/build/amd64-reference/cicada-kernel.wasm" \
          CICADA_PARITY_REFERENCE="$PWD/build/amd64-reference/parity" \
          CICADA_PARITY_DIR="$PWD/build/parity" \
          go test -timeout=20m -tags wasm_integration ./cmd/cicada-kernel-wasm \
            -run '^TestExamplesPCM24Parity$' -count=1 -v | tee build/parity/report.txt
      - name: Save arm64 parity report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: parity-arm64-report
          if-no-files-found: warn
          path: build/parity/report.txt

  studio-cli:
    name: Studio CLI tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'false'
      - name: Tool versions
        run: |
          go version
          tinygo version
      - name: Shards cover every test once
        run: make test-cmd-shard-check SHARDS=3
      - name: cmd/cicada tests
        run: make test-cmd-shard SHARD=${{ matrix.shard }}/3

  m0:
    name: M0 language and kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'false'
      - name: Tool versions
        run: |
          go version
          tinygo version
      - name: Grammar and Go
        run: |
          set -euo pipefail
          make grammar-check
          make test-ci-core
          make test-kernel
          go vet ./...
          make test-golden | tee build/golden-report.txt
          make test-alloc test-timing | tee build/realtime-report.txt
      - name: Audio WASM and size gate
        run: |
          set -euo pipefail
          make probe-wasm
          make test-kernel-wasm | tee build/kernel-wasm-report.txt
          make test-sampler-wasm | tee build/sampler-wasm-report.txt
          make test-keys-wasm | tee build/keys-wasm-report.txt
      - name: Native acid benchmark
        run: |
          set -euo pipefail
          GOMAXPROCS=1 go test ./kernel/voice/acid -run '^$' -bench '^BenchmarkAcidNext' -benchmem -benchtime=1s -count=5 | tee build/acid-bench-report.txt
      - name: M0 CLI acceptance
        run: |
          set -euo pipefail
          make build-core
          {
            ./build/cicada validate examples/first-acid.cicada
            ./build/cicada render examples/first-acid.cicada -o build/first-acid.wav --rate 48000 --bits 24 --bars 16 --tail 3s
            ./build/cicada verify-wav build/first-acid.wav --rate 48000 --bits 24 --bars 16 --tail 3s --peak-max-db -0.3 --dc-max-db -60
            ./build/cicada fmt --check examples/first-acid.cicada
            ./build/cicada convert examples/first-acid.cicada -o build/first-acid.cicada.json
            ./build/cicada convert build/first-acid.cicada.json -o build/first-acid-roundtrip.cicada
            ./build/cicada compare --semantic examples/first-acid.cicada build/first-acid-roundtrip.cicada
          } | tee build/m0-cli-report.txt
      - name: M1 generator and export acceptance
        run: |
          set -euo pipefail
          mkdir -p build/m1-ci
          make test-phrase-wasm | tee build/m1-phrase-wasm-report.txt
          ./build/cicada gen --seed 4242 --key a --scale minor --trace -o build/m1-ci/generated.cicada > build/m1-ci/generated.trace.json
          {
            ./build/cicada validate build/m1-ci/generated.cicada
            ./build/cicada render examples/first-acid.cicada -o build/m1-ci/first-acid-lufs.wav --rate 48000 --bits 24 --bars 16 --tail 3s --loudness -14 && ./build/cicada verify-wav build/m1-ci/first-acid-lufs.wav --rate 48000 --bits 24 --bars 16 --tail 3s --lufs -14 --lufs-tolerance 0.5 --true-peak-max -1
            ./build/cicada stems examples/fx-bus.cicada -o build/m1-ci/stems
            ./build/cicada verify-stems build/m1-ci/stems --tap pre-comp --residual-max-db -80
            ./build/cicada midi examples/first-acid.cicada -o build/m1-ci/first-acid.mid
            ./build/cicada verify-midi build/m1-ci/first-acid.mid --ppq 960 --type 1
          } | tee build/m1-cli-report.txt
      - name: Save gate reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m0-m1-gate-reports
          if-no-files-found: error
          path: |
            build/grammar-doctor.txt
            build/golden-report.txt
            build/realtime-report.txt
            build/kernel-wasm-report.txt
            build/sampler-wasm-report.txt
            build/keys-wasm-report.txt
            build/cicada-loudness.wasm
            build/acid-bench-report.txt
            build/m0-cli-report.txt
            build/m1-phrase-wasm-report.txt
            build/m1-cli-report.txt
            build/m1-ci/generated.cicada
            build/m1-ci/generated.trace.json
            build/m1-ci/first-acid.mid
            build/first-acid.wav

  workstation:
    name: GoSX workstation and Tymbal boundary
    runs-on: ubuntu-24.04
    # Cold Go/race/TinyGo builds must leave time for all Studio browser suites.
    timeout-minutes: 30
    env:
      GOWORK: off
      CHROME_VERSION: 152.0.7977.64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.4'
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'false'
      - name: Supported Node for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Framework generation, race checks, and production bundle
        run: |
          set -euo pipefail
          make test-workstation
          (cd workstation && go vet ./...)
          make build-workstation-release
          git diff --exit-code -- workstation/ui
      - name: Windows workstation and desktop
        run: |
          set -euo pipefail
          (cd workstation && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o ../build/cicada-workstation.exe .)
          (cd desktop && go test ./... && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o ../build/cicada-studio.exe .)
      - name: Studio browser continuity
        shell: bash
        run: |
          set -euo pipefail
          browser_root="$RUNNER_TEMP/cicada-studio-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$browser_root"
          npm install --prefix "$browser_root" --no-save --ignore-scripts playwright@1.62.1
          export CICADA_PLAYWRIGHT_MODULE="$browser_root/node_modules/playwright"
          tool_root="$RUNNER_TOOL_CACHE/chrome-for-testing/$CHROME_VERSION/linux64"
          export CICADA_CHROME_PATH="$tool_root/chrome-headless-shell-linux64/chrome-headless-shell"
          if [[ ! -x "$CICADA_CHROME_PATH" ]]; then
            mkdir -p "$tool_root"
            curl --fail --location --retry 3 --output "$browser_root/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip"
            unzip -q "$browser_root/chrome.zip" -d "$browser_root"
            mv "$browser_root/chrome-headless-shell-linux64" "$tool_root/"
          fi
          # Each suite edits its score and may persist assets and shared drafts.
          # A fresh process alone does not reset those durable sidecars.
          for suite in continuity shell columns collaboration; do
            mkdir -p "$browser_root/$suite"
            node workstation/browser/continuity.test.cjs --write-fixture "$browser_root/$suite/continuity.cicada"
          done
          make build-core
          studio_port="$(node -e 'const server=require("node:net").createServer(); server.listen(0,"127.0.0.1",()=>{process.stdout.write(String(server.address().port));server.close()})')"
          export CICADA_STUDIO_URL="http://127.0.0.1:$studio_port"
          ./build/cicada studio "$browser_root/continuity/continuity.cicada" --audio null --listen "127.0.0.1:$studio_port" > build/studio-continuity-server.log 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid" 2>/dev/null || true; wait "$studio_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            if curl --silent --fail "$CICADA_STUDIO_URL/" > /dev/null; then break; fi
            kill -0 "$studio_pid"
            sleep 0.1
          done
          make test-studio-continuity | tee build/studio-continuity-report.txt
          # Use a new Studio process so its first authenticated session owns it.
          kill "$studio_pid"
          wait "$studio_pid" || true
          ./build/cicada studio "$browser_root/shell/continuity.cicada" --audio null --listen "127.0.0.1:$studio_port" > build/studio-shell-server.log 2>&1 &
          studio_pid=$!
          for _ in $(seq 1 100); do
            if curl --silent --fail "$CICADA_STUDIO_URL/" > /dev/null; then break; fi
            kill -0 "$studio_pid"
            sleep 0.1
          done
          make test-studio-shell | tee build/studio-shell-report.txt
          kill "$studio_pid"
          wait "$studio_pid" || true
          export CICADA_COLUMN_PROOF_DIR="$PWD/build/studio-column-proof"
          ./build/cicada studio "$browser_root/columns/continuity.cicada" --audio null --listen "127.0.0.1:$studio_port" > build/studio-column-server.log 2>&1 &
          studio_pid=$!
          for _ in $(seq 1 100); do
            if curl --silent --fail "$CICADA_STUDIO_URL/" > /dev/null; then break; fi
            kill -0 "$studio_pid"
            sleep 0.1
          done
          make test-studio-columns | tee build/studio-column-report.txt
          kill "$studio_pid"
          wait "$studio_pid" || true
          song_root="$browser_root/song"
          mkdir -p "$song_root"
          song_cli="$PWD/build/cicada"
          (cd "$song_root" && "$song_cli" new first-light)
          export CICADA_SONG_PROOF_DIR="$PWD/build/studio-song-proof"
          for phase in compose reopen; do
            ./build/cicada studio "$song_root/first-light/main.cicada" --audio null --listen "127.0.0.1:$studio_port" > "build/studio-song-$phase-server.log" 2>&1 &
            studio_pid=$!
            for _ in $(seq 1 100); do
              if curl --silent --fail "$CICADA_STUDIO_URL/" > /dev/null; then break; fi
              kill -0 "$studio_pid"
              sleep 0.1
            done
            export CICADA_SONG_REOPEN=0
            if [[ "$phase" == reopen ]]; then export CICADA_SONG_REOPEN=1; fi
            make test-studio-first-song | tee "build/studio-song-$phase-report.txt"
            kill "$studio_pid"
            wait "$studio_pid" || true
          done
          unset CICADA_SONG_REOPEN
          export CICADA_PORTABLE_FIXTURE="$PWD/build/studio-portable-fixture.json"
          export CICADA_PORTABLE_PROOF_DIR="$PWD/build/studio-portable-proof"
          go -C workstation run ./browser/testdata/portable-song > "$CICADA_PORTABLE_FIXTURE"
          portable_score="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["score"])' "$CICADA_PORTABLE_FIXTURE")"
          ./build/cicada midi "$portable_score" -o build/studio-portable-notes.mid --report 2> build/studio-portable-midi-report.json
          python3 -c 'import json; r=json.load(open("build/studio-portable-midi-report.json")); assert r["notes"] > 0 and r["audio_tracks_omitted"] == ["guitar"], r'
          ./build/cicada verify-midi build/studio-portable-notes.mid --ppq 960 --type 1
          ./build/cicada midi "$portable_score" -o build/studio-portable-pattern.mid --pattern tone.melody
          ./build/cicada verify-midi build/studio-portable-pattern.mid --ppq 960 --type 1
          for phase in select reopen; do
            ./build/cicada studio "$portable_score" --audio null --listen "127.0.0.1:$studio_port" > "build/studio-portable-$phase-server.log" 2>&1 &
            studio_pid=$!
            for _ in $(seq 1 100); do
              if curl --silent --fail "$CICADA_STUDIO_URL/" > /dev/null; then break; fi
              kill -0 "$studio_pid"
              sleep 0.1
            done
            export CICADA_PORTABLE_REOPEN=0
            if [[ "$phase" == reopen ]]; then export CICADA_PORTABLE_REOPEN=1; fi
            make test-studio-portable-song | tee "build/studio-portable-$phase-report.txt"
            kill "$studio_pid"
            wait "$studio_pid" || true
          done
          unset CICADA_PORTABLE_REOPEN
          cp -R examples/studio-project "$browser_root/code-recovery"
          export CICADA_CODE_RECOVERY_PROOF="$PWD/build/studio-code-recovery-proof"
          for phase in capture recover verify; do
            ./build/cicada studio "$browser_root/code-recovery/main.cicada" --audio null --listen "127.0.0.1:$studio_port" > "build/studio-code-recovery-$phase-server.log" 2>&1 &
            studio_pid=$!
            for _ in $(seq 1 100); do
              if curl --silent --fail "$CICADA_STUDIO_URL/" > /dev/null; then break; fi
              kill -0 "$studio_pid"
              sleep 0.1
            done
            export CICADA_CODE_RECOVERY_PHASE="$phase"
            make test-studio-code-recovery | tee "build/studio-code-recovery-$phase-report.txt"
            kill "$studio_pid"
            wait "$studio_pid" || true
          done
          unset CICADA_CODE_RECOVERY_PHASE
          cp -R examples/studio-project "$song_root/export-sources"
          export CICADA_EXPORT_PROOF_DIR="$PWD/build/studio-export-proof"
          ./build/cicada studio "$song_root/export-sources/main.cicada" --audio null --listen "127.0.0.1:$studio_port" > build/studio-export-server.log 2>&1 &
          studio_pid=$!
          for _ in $(seq 1 100); do
            if curl --silent --fail "$CICADA_STUDIO_URL/" > /dev/null; then break; fi
            kill -0 "$studio_pid"
            sleep 0.1
          done
          make test-studio-export-sources | tee build/studio-export-report.txt
          kill "$studio_pid"
          wait "$studio_pid" || true
          ./build/cicada studio "$browser_root/collaboration/continuity.cicada" --audio null --listen "127.0.0.1:$studio_port" > build/studio-collaboration-server.log 2>&1 &
          studio_pid=$!
          for _ in $(seq 1 100); do
            if curl --silent --fail "$CICADA_STUDIO_URL/" > /dev/null; then break; fi
            kill -0 "$studio_pid"
            sleep 0.1
          done
          make test-studio-collaboration | tee build/studio-collaboration-report.txt
          kill "$studio_pid"
          wait "$studio_pid" || true
          node workstation/browser/placements.test.cjs --write-fixture "$browser_root/placements.cicada"
          export CICADA_PLACEMENT_PROOF_DIR="$PWD/build/studio-placement-proof"
          export CICADA_PLACEMENT_BUILD="make build-workstation-release"
          ./build/cicada studio "$browser_root/placements.cicada" --audio null --listen "127.0.0.1:$studio_port" > build/studio-placement-server.log 2>&1 &
          studio_pid=$!
          for _ in $(seq 1 100); do
            if curl --silent --fail "$CICADA_STUDIO_URL/api/state" > /dev/null; then break; fi
            kill -0 "$studio_pid"
            sleep 0.1
          done
          make test-studio-placements | tee build/studio-placement-report.txt
          kill "$studio_pid"
          wait "$studio_pid" || true
          node workstation/browser/placements.test.cjs --write-fixture "$browser_root/navigation.cicada"
          ./build/cicada studio "$browser_root/navigation.cicada" --audio null --listen "127.0.0.1:$studio_port" > build/studio-navigation-server.log 2>&1 &
          studio_pid=$!
          for _ in $(seq 1 100); do
            if curl --silent --fail "$CICADA_STUDIO_URL/api/state" > /dev/null; then break; fi
            kill -0 "$studio_pid"
            sleep 0.1
          done
          CICADA_ARRANGEMENT_PROOF_DIR="$PWD/build/studio-arrangement-proof" node --test workstation/browser/arrangement-navigation.test.cjs | tee build/studio-navigation-report.txt
          kill "$studio_pid"
          wait "$studio_pid" || true
          node workstation/browser/placements.test.cjs --write-fixture "$browser_root/gestures.cicada"
          ./build/cicada studio "$browser_root/gestures.cicada" --audio null --listen "127.0.0.1:$studio_port" > build/studio-gestures-server.log 2>&1 &
          studio_pid=$!
          for _ in $(seq 1 100); do
            if curl --silent --fail "$CICADA_STUDIO_URL/api/state" > /dev/null; then break; fi
            kill -0 "$studio_pid"
            sleep 0.1
          done
          CICADA_GESTURE_SCORE="$browser_root/gestures.cicada" CICADA_GESTURE_PROOF_DIR="$PWD/build/studio-gestures-proof" node --test workstation/browser/placement-gestures.test.cjs | tee build/studio-gestures-report.txt
          kill "$studio_pid"
          wait "$studio_pid" || true
          node workstation/browser/placement-autoscroll.test.cjs --write-fixture "$browser_root/autoscroll.cicada"
          ./build/cicada studio "$browser_root/autoscroll.cicada" --audio null --listen "127.0.0.1:$studio_port" > build/studio-autoscroll-server.log 2>&1 &
          studio_pid=$!
          for _ in $(seq 1 100); do
            if curl --silent --fail "$CICADA_STUDIO_URL/api/state" > /dev/null; then break; fi
            kill -0 "$studio_pid"
            sleep 0.1
          done
          CICADA_AUTOSCROLL_PROOF_DIR="$PWD/build/studio-autoscroll-proof" node --test workstation/browser/placement-autoscroll.test.cjs | tee build/studio-autoscroll-report.txt
          kill "$studio_pid"
          wait "$studio_pid" || true
          node workstation/browser/placement-commands.test.cjs --write-fixture "$browser_root/placement-commands.cicada"
          ./build/cicada studio "$browser_root/placement-commands.cicada" --audio null --listen "127.0.0.1:$studio_port" > build/studio-placement-commands-server.log 2>&1 &
          studio_pid=$!
          for _ in $(seq 1 100); do
            if curl --silent --fail "$CICADA_STUDIO_URL/api/state" > /dev/null; then break; fi
            kill -0 "$studio_pid"
            sleep 0.1
          done
          node --test workstation/browser/placement-commands.test.cjs | tee build/studio-placement-commands-report.txt
          kill "$studio_pid"
          wait "$studio_pid" || true
          node workstation/browser/arrangement-sources.test.cjs --write-fixture "$browser_root/arrangement-sources" > build/studio-arrangement-sources-fixture.json
          export CICADA_ARRANGEMENT_FIXTURE="$PWD/build/studio-arrangement-sources-fixture.json"
          export CICADA_ARRANGEMENT_PROOF_DIR="$PWD/build/studio-arrangement-sources-proof"
          for phase in edit reopen; do
            ./build/cicada studio "$browser_root/arrangement-sources/main.cicada" --audio null --listen "127.0.0.1:$studio_port" > "build/studio-arrangement-sources-$phase-server.log" 2>&1 &
            studio_pid=$!
            for _ in $(seq 1 100); do
              if curl --silent --fail "$CICADA_STUDIO_URL/api/state" > /dev/null; then break; fi
              kill -0 "$studio_pid"
              sleep 0.1
            done
            export CICADA_ARRANGEMENT_REOPEN=0
            if [[ "$phase" == reopen ]]; then export CICADA_ARRANGEMENT_REOPEN=1; fi
            node --test workstation/browser/arrangement-sources.test.cjs | tee "build/studio-arrangement-sources-$phase-report.txt"
            if [[ "$phase" == edit ]]; then
              kill "$studio_pid"
              wait "$studio_pid" || true
            fi
          done
          unset CICADA_ARRANGEMENT_REOPEN
          for print_layout in primary secondary song; do
            print_args=()
            print_phases=(sampler producer roundtrip reopen)
            if [[ "$print_layout" == primary ]]; then print_args+=(--primary-arrangement); fi
            if [[ "$print_layout" == song ]]; then
              print_args+=(--scene-song --sampler-bank)
              print_phases=(producer roundtrip reopen)
            fi
            go -C workstation run ./browser/testdata/print-sources "${print_args[@]}" > "build/studio-print-$print_layout-fixture.json"
            export CICADA_PRINT_FIXTURE="$PWD/build/studio-print-$print_layout-fixture.json"
            export CICADA_PRODUCER_SCORE="$(node -e 'process.stdout.write(require(process.argv[1]).score)' "$CICADA_PRINT_FIXTURE")"
            export CICADA_PRODUCER_STORAGE="$(dirname "$CICADA_PRODUCER_SCORE")/session.json"
            export CICADA_PRINT_PROOF_DIR="$PWD/build/studio-print-$print_layout-proof/roundtrip"
            export CICADA_SAMPLER_PROOF_DIR="$PWD/build/studio-print-$print_layout-proof/sampler"
            export CICADA_PRODUCER_PROOF_DIR="$PWD/build/studio-print-$print_layout-proof/producer"
            if [[ "$print_layout" != primary ]]; then
              export CICADA_SAMPLER_ARRANGEMENT_SOURCE="$(node -e 'process.stdout.write(require(process.argv[1]).arrangement)' "$CICADA_PRINT_FIXTURE")"
              export CICADA_PRODUCER_ARRANGEMENT_SOURCE="$CICADA_SAMPLER_ARRANGEMENT_SOURCE"
            fi
            for print_phase in "${print_phases[@]}"; do
              kill "$studio_pid"
              wait "$studio_pid" || true
              ./build/cicada studio "$CICADA_PRODUCER_SCORE" --audio null --listen "127.0.0.1:$studio_port" > "build/studio-print-$print_layout-$print_phase-server.log" 2>&1 &
              studio_pid=$!
              for _ in $(seq 1 100); do
                if curl --silent --fail "$CICADA_STUDIO_URL/api/state" > /dev/null; then break; fi
                kill -0 "$studio_pid"
                sleep 0.1
              done
              export CICADA_PRODUCER_URL="$CICADA_STUDIO_URL" CICADA_PRINT_REOPEN=0
              print_test="$print_phase"
              if [[ "$print_phase" == producer ]]; then print_test=producer-workflow; fi
              if [[ "$print_phase" == roundtrip || "$print_phase" == reopen ]]; then print_test=print-roundtrip; fi
              if [[ "$print_phase" == reopen ]]; then export CICADA_PRINT_REOPEN=1; fi
              node --test "workstation/browser/$print_test.test.cjs" | tee "build/studio-print-$print_layout-$print_phase-report.txt"
            done
            unset CICADA_SAMPLER_ARRANGEMENT_SOURCE CICADA_PRODUCER_ARRANGEMENT_SOURCE CICADA_PRINT_REOPEN
          done
          for editor_mode in buffer project; do
            kill "$studio_pid"
            wait "$studio_pid" || true
            if [[ "$editor_mode" == project ]]; then
              node workstation/browser/code-editor.test.cjs --write-project "$browser_root/editor-project"
              editor_score="$browser_root/editor-project/main.cicada"
              export CICADA_EDITOR_PROJECT=1
              export CICADA_EDITOR_PROJECT_ROOT="$browser_root/editor-project"
            else
              node workstation/browser/code-editor.test.cjs --write-fixture "$browser_root/editor.cicada"
              editor_score="$browser_root/editor.cicada"
              export CICADA_EDITOR_PROJECT=0
            fi
            ./build/cicada studio "$editor_score" --audio null --listen "127.0.0.1:$studio_port" > "build/studio-editor-$editor_mode-server.log" 2>&1 &
            studio_pid=$!
            for _ in $(seq 1 100); do
              if curl --silent --fail "$CICADA_STUDIO_URL/api/state" > /dev/null; then break; fi
              kill -0 "$studio_pid"
              sleep 0.1
            done
            node --test workstation/browser/code-editor.test.cjs | tee "build/studio-editor-$editor_mode-report.txt"
          done
      - name: Save Studio continuity reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: studio-continuity-reports
          if-no-files-found: warn
          path: |
            build/studio-continuity-report.txt
            build/studio-shell-report.txt
            build/studio-shell-server.log
            build/studio-column-report.txt
            build/studio-column-server.log
            build/studio-column-proof/
            build/studio-song-*-report.txt
            build/studio-song-*-server.log
            build/studio-song-proof/
            build/studio-portable-fixture.json
            build/studio-portable-notes.mid
            build/studio-portable-pattern.mid
            build/studio-portable-midi-report.json
            build/studio-portable-*-report.txt
            build/studio-portable-*-server.log
            build/studio-portable-proof/
            build/studio-code-recovery-*-report.txt
            build/studio-code-recovery-*-server.log
            build/studio-code-recovery-proof/*-report.json
            build/studio-code-recovery-proof/*.png
            build/studio-export-report.txt
            build/studio-export-server.log
            build/studio-export-proof/
            build/studio-continuity-server.log
            build/studio-collaboration-report.txt
            build/studio-collaboration-server.log
            build/studio-placement-report.txt
            build/studio-placement-server.log
            build/studio-placement-proof/
            build/studio-navigation-report.txt
            build/studio-navigation-server.log
            build/studio-arrangement-proof/
            build/studio-gestures-report.txt
            build/studio-gestures-server.log
            build/studio-gestures-proof/
            build/studio-autoscroll-report.txt
            build/studio-autoscroll-server.log
            build/studio-autoscroll-proof/
            build/studio-placement-commands-report.txt
            build/studio-placement-commands-server.log
            build/studio-arrangement-sources-*-report.txt
            build/studio-arrangement-sources-*-server.log
            build/studio-arrangement-sources-proof/
            build/studio-print-*-report.txt
            build/studio-print-*-server.log
            build/studio-print-*-fixture.json
            build/studio-print-*-proof/
            build/studio-editor-*-report.txt
            build/studio-editor-*-server.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gosx-workstation-build
          path: workstation/dist/build.json

  macos-desktop:
    name: macOS desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'true'
          binaryen-version: '133'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - name: Verify pinned dependencies and native tests
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          # Connect only the test-created CoreMIDI source; no audio or microphone.
          CICADA_TEST_NATIVE_MIDI: '1'
        run: |
          set -euo pipefail
          test "$(go env GOWORK)" = off
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          go version
          tinygo version
          wasm-opt --version
          (cd desktop && go mod download && go mod verify && go test -race ./... && go vet ./...)
          (cd workstation && go test -race ./... && go vet ./...)
          go test -race ./host/capture ./host/midi ./internal/audiobackend -count=1
          CICADA_COREMIDI_TEST=1 go test -race ./host/midi -run '^TestCoreMIDIInput' -count=1
          go test -race ./cmd/cicada -run '^Test(ApplyRefusesConcurrentSaveAtExchange|StudioLateExternalWriteSurvivesSavesAndRestart|StudioOpenWriterDuringCommitIsRetained|StudioRecoveryWithoutReceiptRefusesSave|RouteGuardsMatchIntentsAndApply|StudioNativeCaptureCapabilityCannotBeBypassedBySavedSettings|AudioSetup.*|InputAuthorization.*|MissingInputPermission.*|NativeMIDI.*|GoSXLive.*)$' -count=1
          CICADA_AUDIO_CALLBACK_NOALLOC=1 go test ./cmd/cicada -run '^TestStudioAudioRenderCallbackDoesNotAllocate$' -count=1
      - name: Verify native audio and WASM determinism
        run: |
          set -euo pipefail
          mkdir -p build
          make test-build-tools
          go test ./kernel/amp ./kernel/dsp/halfband ./kernel/graph ./kernel/voice/ep -count=1 -v | tee build/native-audio-determinism.log
          go test -tags ep_wasm ./kernel/voice/ep -run '^TestEpNativeWASMDeterminism$' -count=1 -v | tee build/ep-wasm-determinism.log
      - name: Verify performed gestures in native and browser audio
        run: |
          set -euo pipefail
          go test ./kernel/seq ./kernel/cmd ./kernel/engine ./host/kernelimage -run 'Performed|Performance|LiveIdentity|LiveGroup|LiveShared|SharedGestures' -count=1 -v | tee build/performed-gesture-native.log
          go test -race ./host/liveplay -run 'LiveGroup' -count=1 -v | tee build/live-shared-audio.log
          go test -race ./cmd/cicada -run '^TestStudio(Gesture|PlayedTake|SharedCapture|ChannelCapture)|^TestGoSXLiveSharedControls' -count=1 -v | tee build/performed-gesture-studio.log
          make build-kernel-wasm
          CICADA_CHORD_WASM_PATH="$PWD/build/cicada-kernel.wasm" go test -timeout=3m -tags chord_wasm ./cmd/cicada-kernel-wasm -run '^TestChordWASM(Per|LiveIdentity|Shared)' -count=1 -v | tee build/performed-gesture-wasm.log
      - name: Package and launch from a clean checkout
        run: |
          set -euo pipefail
          desktop/package.sh --target darwin --version 0.0.0-ci --output build/macos
          codesign --verify --deep --strict 'build/macos/Cicada Studio.app'
          go version -m 'build/macos/Cicada Studio.app/Contents/MacOS/cicada-studio'
          python3 -m unittest discover -s desktop -p test_smoke.py
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/recording --mode normal --workflow desktop/testdata/native-recording-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/import --mode normal --workflow desktop/testdata/native-import-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/arrange --mode normal --timeout 120 --workflow desktop/testdata/native-arrange-workflow.js
          (cd desktop && CICADA_TEST_EDITOR_MENU_WORKFLOW="$PWD/../build/native-editor-workflow.js" go test -mod=readonly -run 'TestMacMenusKeepHistoryShortcutsInWorkstation|TestMacEditorMenuWorkflow' -count=1 .)
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/editor --mode normal --timeout 120 --workflow build/native-editor-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/code-recovery --mode code-recovery --timeout 120
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/cancellation --mode normal --workflow desktop/testdata/native-cancellation-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/sounds --mode normal --timeout 120 --workflow desktop/testdata/native-sounds-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/shared-capture --mode normal --timeout 120 --workflow desktop/testdata/native-shared-capture-workflow.js
          python3 -c "from pathlib import Path; Path('build/native-channel-capture-workflow.js').write_text('window.__cicadaChannelCapture=true;\n'+Path('desktop/testdata/native-shared-capture-workflow.js').read_text())"
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/channel-capture --mode normal --timeout 120 --workflow build/native-channel-capture-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/dock-fit --mode normal --timeout 120 --workflow desktop/testdata/native-dock-fit-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/columns --mode normal --timeout 120 --workflow desktop/testdata/native-columns-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/export --mode normal --timeout 120 --workflow desktop/testdata/native-export-workflow.js
          go -C workstation run ./browser/testdata/portable-song > build/native-portable-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/portable --mode normal --timeout 120 --portable-fixture build/native-portable-fixture.json
          node workstation/browser/arrangement-sources.test.cjs --write-fixture build/native-arrangement-sources > build/native-arrangement-sources-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/arrangement-sources --mode normal --timeout 120 --project-fixture build/native-arrangement-sources/main.cicada --workflow desktop/testdata/native-arrangement-sources-workflow.js
          go -C workstation run ./browser/testdata/print-sources --sampler-bank > build/native-print-sources-fixture.json
          print_score="$(node -e 'process.stdout.write(require("./build/native-print-sources-fixture.json").score)')"
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/print-sources --mode normal --timeout 180 --project-fixture "$print_score" --workflow desktop/testdata/native-print-sources-workflow.js
          go -C workstation run ./browser/testdata/print-sources --scene-song --sampler-bank > build/native-song-sources-fixture.json
          song_score="$(node -e 'process.stdout.write(require("./build/native-song-sources-fixture.json").score)')"
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/song-sources --mode normal --timeout 180 --project-fixture "$song_score" --workflow desktop/testdata/native-print-sources-workflow.js
          git diff --exit-code -- desktop/go.mod desktop/go.sum workstation/go.mod workstation/go.sum workstation/ui
      - name: Save macOS validation reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-desktop-${{ matrix.arch }}-reports
          if-no-files-found: warn
          path: |
            build/macos-smoke/
            build/native-audio-determinism.log
            build/ep-wasm-determinism.log
            build/performed-gesture-native.log
            build/live-shared-audio.log
            build/performed-gesture-studio.log
            build/performed-gesture-wasm.log

  m2-pr:
    name: M2 AudioWorklet gates
    # This job runs on the self-hosted reference machine, so a pull request from
    # a fork must not run it.
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 40
    env:
      GOWORK: off
      CHROME_VERSION: 152.0.7977.64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'false'
      # The runner's system Node is too old for the demo browser test, which
      # needs the global WebSocket that Node 22 provides.
      - name: Supported Node for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Cache pinned Chrome for Testing headless shell
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TOOL_CACHE/chrome-for-testing/$CHROME_VERSION/linux64"
          browser_path="$tool_root/chrome-headless-shell-linux64/chrome-headless-shell"
          if [[ ! -x "$browser_path" ]]; then
            mkdir -p "$tool_root"
            temp_dir="$(mktemp -d "$RUNNER_TEMP/chrome-for-testing.XXXXXX")"
            trap 'rm -rf "$temp_dir"' EXIT
            archive="$temp_dir/chrome-headless-shell.zip"
            curl --fail --location --retry 3 --output "$archive" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip"
            unzip -q "$archive" -d "$temp_dir"
            mv "$temp_dir/chrome-headless-shell-linux64" "$tool_root/"
          fi
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
          PULSE_SERVER=unix:/nonexistent "$browser_path" --mute-audio --version
          go version
          tinygo version
          node --version
      - name: M2 parity, browser, and budgets
        run: make test-wasm test-chord-wasm test-browser test-demo-browser budget-size budget-browser
      - name: WAM2 export and reference host
        env:
          CICADA_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/cicada-wam2-evidence
        run: make test-wam2
      - name: Save WAM2 GUI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wam2-gui-evidence
          if-no-files-found: error
          path: ${{ runner.temp }}/cicada-wam2-evidence/*.png
      - name: Save M2 gate reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m2-audioworklet-gate-reports
          if-no-files-found: warn
          path: |
            build/test-wasm.log
            build/test-chord-wasm.log
            build/chord-wasm-report.txt
            build/test-browser.log
            build/budget-size-report.txt
            build/budget-browser.log
            build/browser-cpu-report.json
            build/m2-browser-chrome.log
            build/demo-evidence/

  m2-soak:
    name: M2 AudioWorklet nightly soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Its CPU gate (0.67 ms per callback) is measured on the reference machine.
    # A hosted runner measured 1.296 ms, so this job stays on the self-hosted one.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 55
    env:
      GOWORK: off
      CHROME_VERSION: 152.0.7977.64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: '0.41.1'
          install-binaryen: 'false'
      - name: Supported Node for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Cache pinned Chrome for Testing headless shell
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TOOL_CACHE/chrome-for-testing/$CHROME_VERSION/linux64"
          browser_path="$tool_root/chrome-headless-shell-linux64/chrome-headless-shell"
          if [[ ! -x "$browser_path" ]]; then
            mkdir -p "$tool_root"
            temp_dir="$(mktemp -d "$RUNNER_TEMP/chrome-for-testing.XXXXXX")"
            trap 'rm -rf "$temp_dir"' EXIT
            archive="$temp_dir/chrome-headless-shell.zip"
            curl --fail --location --retry 3 --output "$archive" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip"
            unzip -q "$archive" -d "$temp_dir"
            mv "$temp_dir/chrome-headless-shell-linux64" "$tool_root/"
          fi
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
          PULSE_SERVER=unix:/nonexistent "$browser_path" --mute-audio --version
          go version
          tinygo version
          node --version
      - name: Run full 30-minute browser soak
        run: make test-browser-soak
      - name: Save M2 soak report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m2-audioworklet-soak-report
          if-no-files-found: warn
          path: |
            build/browser-soak.log
            build/browser-soak-report.json
            build/demo-soak-report.json
            build/demo-evidence/
            build/browser-cpu-report.json
            build/m2-browser-chrome.log
