name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      soak:
        # The soak holds the one self-hosted reference machine for about 35
        # minutes, and every pull request's CPU gate queues behind it.
        description: Also run the 30-minute M2 AudioWorklet soak on the self-hosted reference machine
        type: boolean
        default: false

permissions:
  contents: read

env:
  WASMOPT: wasm-opt

# Skipped jobs and the required check (read before editing the jobs below)
#
# The repository ruleset on main requires one status check, "M0 language and
# kernel". GitHub counts a job that `if:` skipped as passing, and it skips a
# job by default when a job it `needs` failed or was cancelled. So a required
# job that simply `needs` its parts would turn green exactly when a part
# fails. The job named "M0 language and kernel" therefore runs with
# `if: always()` and fails by itself unless every part either succeeded or was
# skipped on purpose (the `changes` job said the pull request cannot affect it).
# Keep that name on that aggregate job, and never give a part the same name.
#
# Which jobs a pull request runs comes from scripts/ci-changes.sh (see the
# `changes` job). Pushes to main, the nightly schedule and manual runs set
# every group to true, so they run every job.
concurrency:
  group: cicada-ci-${{ github.ref }}-${{ github.event_name }}
  # A newer push to a pull request cancels its older run. Runs on main finish,
  # so a merge is not left without a result when the next merge lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies a pull request from its changed files so that jobs a change cannot
  # affect are skipped. The rules and their evidence are in scripts/ci-changes.sh;
  # scripts/ci-changes_test.sh tests them. Push, schedule and manual runs set
  # every output to true.
  changes:
    name: Classify changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      root: ${{ steps.classify.outputs.root }}
      studio_cli: ${{ steps.classify.outputs.studio_cli }}
      parity: ${{ steps.classify.outputs.parity }}
      workstation: ${{ steps.classify.outputs.workstation }}
      studio_browser: ${{ steps.classify.outputs.studio_browser }}
      macos_desktop: ${{ steps.classify.outputs.macos_desktop }}
      macos_contracts: ${{ steps.classify.outputs.macos_contracts }}
      m2: ${{ steps.classify.outputs.m2 }}
      m2_gates: ${{ steps.classify.outputs.m2_gates }}
      bench: ${{ steps.classify.outputs.bench }}
      wav_sweep: ${{ steps.classify.outputs.wav_sweep }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The three-dot diff below needs the merge base.
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # --no-renames lists both the old and the new path of a move.
            git -c core.quotepath=off diff --name-only --no-renames "$PR_BASE_SHA...$PR_HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
            echo "Changed files:"
            cat "$RUNNER_TEMP/changed-files.txt"
            bash scripts/ci-changes.sh < "$RUNNER_TEMP/changed-files.txt" > "$RUNNER_TEMP/groups.txt"
          else
            bash scripts/ci-changes.sh --all > "$RUNNER_TEMP/groups.txt"
          fi
          echo "Groups:"
          cat "$RUNNER_TEMP/groups.txt"
          cat "$RUNNER_TEMP/groups.txt" >> "$GITHUB_OUTPUT"

  native-go127:
    name: Native Go 1.27.3 (core minimum remains 1.25)
    needs: changes
    if: ${{ needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-24.04
    # One cold build of every package plus the whole test suite on one runner;
    # the other jobs split the same work across runners. The cmd/cicada tests
    # run in the three shards the Studio CLI jobs use: as one binary they took
    # 996 s of a 1,200 s limit in this job's first run.
    timeout-minutes: 45
    env:
      GOWORK: off
      GOTOOLCHAIN: go1.27.3
      # The limit for every go test below, including those that make and
      # scripts/cmdshard start. go test's default is 10 minutes, and the phrase
      # package took 506 s of it in this job's first run, so use twice that.
      GOFLAGS: -timeout=20m
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Tool versions
        run: go version
      # A newer compiler can inline differently and fuse a product the go.mod
      # toolchain does not; cross-compiling for arm64 prints its report.
      - name: No fused multiply-adds with Go 1.27.3 (arm64 and GOAMD64=v3)
        run: |
          set -euo pipefail
          GOARCH=arm64 scripts/check-fma.sh
          GOARCH=amd64 GOAMD64=v3 scripts/check-fma.sh
      - name: Shards cover every test once
        run: make test-cmd-shard-check SHARDS=3
      - name: Native tests, every package but cmd/cicada
        run: make test-ci-core
      - name: Native tests, cmd/cicada in three shards
        run: |
          set -euo pipefail
          for shard in 1 2 3; do
            make test-cmd-shard SHARD="$shard/3"
          done
      - name: Vet (no TinyGo override)
        run: go vet ./...

  commit-hygiene:
    name: Commit metadata hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every pull request commit
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-commit-hygiene.sh "$PR_BASE_SHA" "$PR_HEAD_SHA"
      # These tests need only bash, so they run on every pull request, even
      # one that changes only documentation.
      - name: Test the change classifier and the Studio browser shard lists
        run: |
          set -euo pipefail
          bash scripts/ci-changes_test.sh
          bash scripts/ci-studio-browser_test.sh
          bash scripts/ci-setup-wasm-tools_test.sh
          bash scripts/ci-studio-browser.sh check

  # Runs on every pull request, including one that changes only documentation.
  # TestDocumentationHygiene reads every tracked file, and the other tests read
  # the manual, the specification, the README or the parameter tables. The
  # jobs that would otherwise run them (Studio CLI, native, M0) can be skipped.
  repo-checks:
    name: Repository and documentation checks
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Supported Node for the worklet build
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Change classifier matches the import graph
        run: bash scripts/ci-changes_test.sh --graph
      # host/web/assets.go embeds processor.min.js, and the size budget measures
      # it, so a stale minified file would pass the gates on an old worklet.
      - name: Committed minified worklets are current
        run: |
          set -euo pipefail
          make build-worklets
          git diff --exit-code -- host/web/processor.min.js host/web/processor-capture.min.js
      - name: Tests that read every tracked file, the docs, or the README
        run: |
          set -euo pipefail
          tests='TestDocumentationHygiene TestPublicHygieneRejectsViolations TestCommitHygiene TestExperimentalPolyphonyDocumentationContainsNoVerificationSnapshot TestDocumentationCicadaExamples TestDocumentationExamplesUseEditionTwo TestDocumentationEBNFMatchesGrammarDSL TestManualMixingExampleWorksInFreshProject TestWritingMusicOpeningScoreIsFormatted TestRecordKitManualMatchesTheCommand TestRecordKitManualStatesTheFrameBudget TestRecordKitManualStatesWhichDoubleStrikesTheCommandWarnsAbout TestRecordKitManualStatesWhereASliceStartsAndWhatTheRoomIs TestAcceptedMasteringCheckRenderAndVerify TestParameterRangesDocIsCurrent TestBuiltInTrackParameterCatalogMatchesTable TestBrushDocExamplesRenderAndKeepTheirBlockIndependence TestSamplerReportsStayOutsideRepository TestDocumentedCodesExist TestDiagnosticsReferenceIsCurrent TestNotesReasonsMatchTheEditor'
          regex="^($(echo "$tests" | tr ' ' '|'))\$"
          go test -v -count=1 ./cmd/cicada ./project ./render ./host/instrumentpack ./internal/diagnostics -run "$regex" | tee "$RUNNER_TEMP/repo-checks.log"
          # go test exits 0 when -run matches nothing, for example after a rename.
          missing=0
          for name in $tests; do
            if ! grep -q -- "^--- PASS: $name " "$RUNNER_TEMP/repo-checks.log"; then
              echo "No PASS line for $name; was it renamed or skipped?" >&2
              missing=1
            fi
          done
          exit "$missing"
      # The agent task suite (make test-agent-surface) drives the built binary
      # through one task with JSON output only. The M0 kernel job runs it when
      # the root group is on (any Go change, cmd/cicada and edit included).
      # When the classifier turns the root group off, as it does for a change
      # under docs/, it runs here instead: agents read the formats it checks.
      - name: Agent task suite, when the M0 jobs are skipped
        if: needs.changes.outputs.root != 'true'
        run: |
          set -euo pipefail
          make test-agent-surface | tee "$RUNNER_TEMP/agent-surface.log"
          # go test exits 0 when -run matches nothing, for example after a rename.
          grep -q -- '^--- PASS: TestAgentTaskSuite ' "$RUNNER_TEMP/agent-surface.log"
          grep -q -- '^--- PASS: TestAgentDocumentationExamples ' "$RUNNER_TEMP/agent-surface.log"

  parity-amd64:
    name: PCM24 parity (amd64, WASM)
    needs: changes
    if: ${{ needs.changes.outputs.parity == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-wasm-tools
      - name: Render all examples with amd64 and WASM
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = amd64
          make test-parity
      - name: Require the master-chain digests, and no fused multiply-adds on the render path, with GOAMD64=v3
        run: |
          set -euo pipefail
          GOAMD64=v3 go test ./kernel/dsp/detmath ./kernel/fx/... ./kernel/mix ./kernel/loudness -run '^Test([A-Za-z0-9]*Digest[A-Za-z0-9]*|TruePeakWindowIsBlackman|SpecialValues|TrigOutOfRange|RenderPathAvoidsMathLibrary|[A-Za-z0-9]*FastPathExhaustive)$' -count=1
          GOAMD64=v3 scripts/check-fma.sh
      # The arm64 job compares its exported WAV files with these hashes.
      - name: Hash the WAV files cicada render writes for the parity subset
        run: |
          set -euo pipefail
          CICADA_WAV_PARITY_OUT="$PWD/build/parity/wav-hashes.txt" go test -timeout=20m ./cmd/cicada -run '^TestExampleWAVParity$' -count=1 -v | tee build/parity/wav-parity.txt
          grep -q -- '^--- PASS: TestExampleWAVParity ' build/parity/wav-parity.txt
      - name: Save amd64 PCM and the tested kernel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: parity-amd64
          if-no-files-found: error
          retention-days: 7
          path: |
            build/cicada-kernel.wasm
            build/cicada-modular.wasm
            build/cicada-keys-modular.wasm
            build/parity/*.pcm24
            build/parity/report.txt
            build/parity/wav-hashes.txt

  parity-arm64:
    name: PCM24 parity (amd64, arm64, WASM)
    needs: [changes, parity-amd64]
    if: ${{ !cancelled() && needs.changes.outputs.parity == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      GOWORK: off
    steps:
      - name: Require the amd64 parity gate to pass
        env:
          AMD64_PARITY_RESULT: ${{ needs.parity-amd64.result }}
        run: test "$AMD64_PARITY_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: parity-amd64
          path: build/amd64-reference
      - name: Require identical amd64, arm64, and WASM PCM24
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = arm64
          mkdir -p build/parity
          CICADA_WASM_PATH="$PWD/build/amd64-reference/cicada-kernel.wasm" \
          CICADA_MODULAR_WASM_PATH="$PWD/build/amd64-reference/cicada-modular.wasm" \
          CICADA_PARITY_REFERENCE="$PWD/build/amd64-reference/parity" \
          CICADA_PARITY_DIR="$PWD/build/parity" \
          go test -timeout=20m -tags wasm_integration ./cmd/cicada-kernel-wasm \
            -run '^TestExamplesPCM24Parity$' -count=1 -v | tee build/parity/report.txt
          CICADA_MODULAR_WASM_PATH="$PWD/build/amd64-reference/cicada-modular.wasm" \
          go test -timeout=5m -tags wasm_integration ./cmd/cicada-kernel-wasm \
            -run '^TestMappedMacroNativeWASMParity$' -count=1 -v | tee -a build/parity/report.txt
          CICADA_MODULAR_WASM_PATH="$PWD/build/amd64-reference/cicada-modular.wasm" \
          go test -timeout=5m -tags wasm_integration ./cmd/cicada-kernel-wasm \
            -run '^TestInstrumentVibratoNativeWASMParity$' -count=1 -v | tee -a build/parity/report.txt
          CICADA_MODULAR_WASM_PATH="$PWD/build/amd64-reference/cicada-modular.wasm" \
          go test -timeout=5m -tags wasm_integration ./cmd/cicada-kernel-wasm \
            -run '^TestChorus(NativeWASMParity|InstrumentModulatorNativeWASMParity|GraphLFONativeWASMParity)$' -count=1 -v | tee -a build/parity/report.txt
          CICADA_WASM_PATH="$PWD/build/amd64-reference/cicada-kernel.wasm" \
          go test -timeout=5m -tags wasm_integration ./cmd/cicada-kernel-wasm \
            -run '^TestChorusRejectedByCoreKernel$' -count=1 -v | tee -a build/parity/report.txt
          CICADA_KEYS_MODULAR_WASM_PATH="$PWD/build/amd64-reference/cicada-keys-modular.wasm" \
          go test -timeout=5m -tags wasm_integration ./cmd/cicada-kernel-wasm \
            -run '^TestKeysChorusNativeWASMParity$' -count=1 -v | tee -a build/parity/report.txt
          CICADA_WASM_PATH="$PWD/build/amd64-reference/cicada-kernel.wasm" CICADA_MODULAR_WASM_PATH="$PWD/build/amd64-reference/cicada-modular.wasm" \
          go test -timeout=5m -tags wasm_integration ./cmd/cicada-kernel-wasm \
            -run '^TestInstrumentModulatorNativeWASMParity$' -count=1 -v | tee -a build/parity/report.txt
          CICADA_WASM_PATH="$PWD/build/amd64-reference/cicada-kernel.wasm" CICADA_MODULAR_WASM_PATH="$PWD/build/amd64-reference/cicada-modular.wasm" \
          go test -timeout=5m -tags wasm_integration ./cmd/cicada-kernel-wasm \
            -run '^TestGraphLFONativeWASMParity$' -count=1 -v | tee -a build/parity/report.txt
          CICADA_KEYS_MODULAR_WASM_PATH="$PWD/build/amd64-reference/cicada-keys-modular.wasm" \
          go test -timeout=5m -tags wasm_integration ./cmd/cicada-kernel-wasm \
            -run '^TestGraphLFOKeysNativeWASMParity$' -count=1 -v | tee -a build/parity/report.txt
          CICADA_KEYS_MODULAR_WASM_PATH="$PWD/build/amd64-reference/cicada-keys-modular.wasm" \
          go test -timeout=20m -tags wasm_integration ./cmd/cicada-kernel-wasm \
            -run '^TestKeysModularWASMParity$' -count=1 -v | tee -a build/parity/report.txt
      - name: Require the modulator sources, master chain, detmath and loudness export to match their reference digests on arm64
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = arm64
          go test ./kernel/modulate -count=1 -v | tee build/parity/modulate.txt
          go test ./cmd/cicada-kernel-wasm -run '^TestDetailVectors$' -count=1 -v | tee -a build/parity/modulate.txt
          go test ./kernel/dsp/detmath ./kernel/fx/... ./kernel/mix ./kernel/loudness -run '^Test([A-Za-z0-9]*Digest[A-Za-z0-9]*|TruePeakWindowIsBlackman|[A-Za-z0-9]*Accuracy|SpecialValues|TrigOutOfRange|[A-Za-z0-9]*FastPathExhaustive)$' -count=1 -v | tee "$RUNNER_TEMP/arm64-digests.log"
          go test ./cmd/cicada -run '^TestExportLoudness' -count=1 -v | tee -a "$RUNNER_TEMP/arm64-digests.log"
          cat "$RUNNER_TEMP/arm64-digests.log" >> build/parity/modulate.txt
          # A product that feeds an addition must be rounded first; the compiler
          # lists every one it would fuse into a multiply-add on this machine, also
          # where it is inlined ("<autogenerated>:1:0; kernel/fx/...").
          scripts/check-fma.sh
          # go test exits 0 when -run matches nothing, for example after a rename.
          missing=0
          for name in TestEQDigestIsIdenticalOnEveryTarget TestMeterDigestIsIdenticalOnEveryTarget TestTruePeakWindowIsBlackman TestExportLoudnessWithoutLimiterKeepsCrestPreservingGain \
            TestIdentityDigest TestAccuracy TestPowAccuracy TestSpecialValues TestCompressorDigest TestDeesserDigest TestDelayDigest TestDriveDigest TestReverbDigest \
            TestLimiterDigest TestTransientDigest TestWidthDigest TestRoomDigest TestChainDigest TestNormalizeDigest TestChorusDigest TestConvolutionDigest TestTapeDigest TestMixDigest TestAmpcabOutputDigest TestTrigOutOfRange TestTanh32FastPathExhaustive \
            TestTanh32Digest TestAtanDigest TestAtanAccuracy TestSinPiDigest TestSinPiAccuracy TestLog1pDigest TestLog1pAccuracy \
            TestNearDigest TestTanhNearAccuracy TestSinPiNearAccuracy TestFilterCoefficientDigest TestTanPi32FastPathExhaustive TestOneMinusExpNeg2Pi32FastPathExhaustive; do
            if ! grep -q -- "^--- PASS: $name " "$RUNNER_TEMP/arm64-digests.log"; then
              echo "No PASS line for $name; was it renamed or skipped?" >&2
              missing=1
            fi
          done
          exit "$missing"
      # The PCM24 test above compares the engine's samples; this one compares the
      # files `cicada render` writes (master chain, loudness search, normalize,
      # dither, WAV encoder) with the amd64 job's hashes.
      - name: Require the parity subset's WAV files to match amd64 byte for byte
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = arm64
          CICADA_WAV_PARITY_REFERENCE="$PWD/build/amd64-reference/parity/wav-hashes.txt" go test -timeout=20m ./cmd/cicada -run '^(TestExampleWAVParity|TestExampleWAVPins)$' -count=1 -v | tee build/parity/wav-parity.txt
          grep -q -- '^--- PASS: TestExampleWAVParity ' build/parity/wav-parity.txt
          grep -q -- '^--- PASS: TestExampleWAVPins ' build/parity/wav-parity.txt
      - name: Save arm64 parity report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: parity-arm64-report
          if-no-files-found: warn
          path: |
            build/parity/report.txt
            build/parity/modulate.txt
            build/parity/wav-parity.txt

  # Nightly: every score under examples/, rendered four ways on amd64 and on
  # arm64, compared byte for byte (TestExampleWAVParity with
  # CICADA_WAV_PARITY_ALL=1), and every pinned render including the songs
  # (TestExampleWAVPins). Pull requests run it too when they change the
  # deterministic math or the WAV parity test (the wav_sweep group of
  # scripts/ci-changes.sh); other pull requests render only the parity subset
  # above.
  wav-parity-sweep-amd64:
    name: WAV parity sweep, every example (amd64)
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.wav_sweep == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Render every example four ways and hash the WAV files
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = amd64
          mkdir -p build/wav-parity
          CICADA_WAV_PARITY_ALL=1 CICADA_WAV_PARITY_OUT="$PWD/build/wav-parity/wav-hashes.txt" go test -timeout=55m ./cmd/cicada -run '^(TestExampleWAVParity|TestExampleWAVPins)$' -count=1 -v | tee build/wav-parity/report.txt
          grep -q -- '^--- PASS: TestExampleWAVParity ' build/wav-parity/report.txt
          grep -q -- '^--- PASS: TestExampleWAVPins ' build/wav-parity/report.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wav-parity-amd64
          if-no-files-found: error
          retention-days: 7
          path: build/wav-parity/wav-hashes.txt

  wav-parity-sweep-arm64:
    name: WAV parity sweep, every example (arm64 against amd64)
    needs: [changes, wav-parity-sweep-amd64]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.wav_sweep == 'true')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GOWORK: off
    steps:
      - name: Require the amd64 sweep to pass
        env:
          AMD64_SWEEP_RESULT: ${{ needs.wav-parity-sweep-amd64.result }}
        run: test "$AMD64_SWEEP_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: wav-parity-amd64
          path: build/amd64-reference
      - name: Render every example four ways and compare with amd64
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = arm64
          mkdir -p build/wav-parity
          CICADA_WAV_PARITY_ALL=1 CICADA_WAV_PARITY_REFERENCE="$PWD/build/amd64-reference/wav-hashes.txt" go test -timeout=55m ./cmd/cicada -run '^(TestExampleWAVParity|TestExampleWAVPins)$' -count=1 -v | tee build/wav-parity/report.txt
          grep -q -- '^--- PASS: TestExampleWAVParity ' build/wav-parity/report.txt
          grep -q -- '^--- PASS: TestExampleWAVPins ' build/wav-parity/report.txt
      - name: Save the arm64 sweep report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wav-parity-arm64-report
          if-no-files-found: warn
          retention-days: 7
          path: build/wav-parity/report.txt

  studio-cli:
    name: Studio CLI tests (shard ${{ matrix.shard }}/3)
    needs: changes
    if: ${{ needs.changes.outputs.studio_cli == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-wasm-tools
      - name: Tool versions
        run: |
          go version
          tinygo version
      - name: Shards cover every test once
        run: make test-cmd-shard-check SHARDS=3
      - name: cmd/cicada tests
        run: make test-cmd-shard SHARD=${{ matrix.shard }}/3

  # Speed gates for an agent's loop (plan.cicada.speed, row F7): process start,
  # check, apply, render, a loudness render and audition on the reference
  # scores, as the median of 5 runs after one warm-up run. Pull requests and
  # pushes report; the nightly run enforces the gates
  # (cmd/cicada-bench/gates.go). It is not a required check. The large song's
  # render and audition cover its first 8 bars, so the job stays under five
  # minutes on the slower runners (16 bars took 6m07s with the warm-up).
  bench:
    name: Agent loop speed
    needs: changes
    if: ${{ needs.changes.outputs.bench == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build cicada
        run: make build-core
      - name: Measure
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          enforce=()
          if [[ "$EVENT_NAME" == schedule ]]; then enforce=(--enforce); fi
          make bench-agent-loop BENCH_ARGS="${enforce[*]}" | tee build/bench-agent-loop.txt
      - name: Save the measurements
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bench-agent-loop
          if-no-files-found: warn
          path: |
            build/bench-agent-loop.json
            build/bench-agent-loop.txt

  # Every example score, rendered in full with and without the stored mix that
  # loudness passes and peak normalization replay (render.MasterCache), must
  # write the same bytes: plain, normalized, and at two loudness targets. The
  # pull request tests run one short score per master path; this is the whole
  # sweep, nightly, on both architectures.
  render-identity:
    name: Render cache identity sweep (${{ matrix.arch }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Sweep
        run: |
          set -euo pipefail
          mkdir -p build
          make test-render-identity | tee build/render-identity.log
      - name: Save the sweep log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: render-identity-${{ matrix.arch }}
          if-no-files-found: warn
          path: build/render-identity.log

  # M0 ran as one job of about 29 minutes. It is now three parallel jobs and an
  # aggregate. Every command that was in the single job is in exactly one part.
  m0-core:
    name: M0 grammar and Go tests
    needs: changes
    if: ${{ needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-wasm-tools
      - name: Tool versions
        run: |
          go version
          tinygo version
      - name: Grammar and Go
        run: |
          set -euo pipefail
          make grammar-check
          make test-ci-core
      - name: Save gate reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m0-core-reports
          if-no-files-found: error
          path: build/grammar-doctor.txt

  m0-kernel:
    name: M0 kernel, golden, realtime, CLI and generator
    needs: changes
    if: ${{ needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-wasm-tools
      - name: Tool versions
        run: |
          go version
          tinygo version
      - name: Kernel tests, vet, golden and realtime gates
        run: |
          set -euo pipefail
          mkdir -p build
          make test-kernel
          go vet ./...
          make test-golden | tee build/golden-report.txt
          make test-alloc test-timing | tee build/realtime-report.txt
      - name: Native acid benchmark
        run: |
          set -euo pipefail
          GOMAXPROCS=1 go test ./kernel/voice/acid -run '^$' -bench '^BenchmarkAcidNext' -benchmem -benchtime=1s -count=5 | tee build/acid-bench-report.txt
      - name: M0 CLI acceptance
        run: |
          set -euo pipefail
          make build-core
          {
            ./build/cicada validate examples/first-acid.cicada
            ./build/cicada render examples/first-acid.cicada -o build/first-acid.wav --rate 48000 --bits 24 --bars 16 --tail 3s
            ./build/cicada verify-wav build/first-acid.wav --rate 48000 --bits 24 --bars 16 --tail 3s --peak-max-db -0.3 --dc-max-db -60
            ./build/cicada fmt --check examples/first-acid.cicada
            ./build/cicada convert examples/first-acid.cicada -o build/first-acid.cicada.json
            ./build/cicada convert build/first-acid.cicada.json -o build/first-acid-roundtrip.cicada
            ./build/cicada compare --semantic examples/first-acid.cicada build/first-acid-roundtrip.cicada
          } | tee build/m0-cli-report.txt
      - name: M1 generator and export acceptance
        run: |
          set -euo pipefail
          mkdir -p build/m1-ci
          make test-phrase-wasm | tee build/m1-phrase-wasm-report.txt
          ./build/cicada gen --seed 4242 --key a --scale minor --trace -o build/m1-ci/generated.cicada > build/m1-ci/generated.trace.json
          {
            ./build/cicada validate build/m1-ci/generated.cicada
            ./build/cicada render examples/first-acid.cicada -o build/m1-ci/first-acid-lufs.wav --rate 48000 --bits 24 --bars 16 --tail 3s --loudness -14 && ./build/cicada verify-wav build/m1-ci/first-acid-lufs.wav --rate 48000 --bits 24 --bars 16 --tail 3s --lufs -14 --lufs-tolerance 0.5 --true-peak-max -1
            ./build/cicada stems examples/fx-bus.cicada -o build/m1-ci/stems
            ./build/cicada verify-stems build/m1-ci/stems --tap pre-comp --residual-max-db -80
            ./build/cicada midi examples/first-acid.cicada -o build/m1-ci/first-acid.mid
            ./build/cicada verify-midi build/m1-ci/first-acid.mid --ppq 960 --type 1
          } | tee build/m1-cli-report.txt
      - name: Agent task suite (help, intents, check, apply, render and audition as JSON)
        run: |
          set -euo pipefail
          make test-agent-surface | tee build/agent-surface-report.txt
          # go test exits 0 when -run matches nothing, for example after a rename.
          grep -q -- '^--- PASS: TestAgentTaskSuite ' build/agent-surface-report.txt
          grep -q -- '^--- PASS: TestAgentDocumentationExamples ' build/agent-surface-report.txt
      - name: Save gate reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m0-kernel-reports
          if-no-files-found: error
          path: |
            build/golden-report.txt
            build/realtime-report.txt
            build/acid-bench-report.txt
            build/m0-cli-report.txt
            build/m1-phrase-wasm-report.txt
            build/m1-cli-report.txt
            build/agent-surface-report.txt
            build/m1-ci/generated.cicada
            build/m1-ci/generated.trace.json
            build/m1-ci/first-acid.mid
            build/first-acid.wav

  m0-wasm:
    name: M0 audio WASM and size gate
    needs: changes
    if: ${{ needs.changes.outputs.root == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-wasm-tools
      - name: Tool versions
        run: |
          go version
          tinygo version
      - name: Audio WASM and size gate
        run: |
          set -euo pipefail
          mkdir -p build
          make probe-wasm
          make test-kernel-wasm | tee build/kernel-wasm-report.txt
          make test-sampler-wasm | tee build/sampler-wasm-report.txt
          make test-keys-wasm | tee build/keys-wasm-report.txt
      - name: Deterministic-math and processor digests compiled by TinyGo for WebAssembly
        run: make test-tinygo-digests
      - name: Save gate reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m0-wasm-reports
          if-no-files-found: error
          path: |
            build/kernel-wasm-report.txt
            build/sampler-wasm-report.txt
            build/keys-wasm-report.txt
            build/tinygo-digests.txt
            build/cicada-loudness.wasm

  # The required status check. See the comment above `concurrency:`. This job
  # must keep `if: always()`: without it GitHub skips the job when a part fails,
  # and a skipped required check counts as passing.
  m0:
    name: M0 language and kernel
    needs: [changes, commit-hygiene, repo-checks, m0-core, m0-kernel, m0-wasm]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This one required check also stands for the always-on jobs. The tests
      # that read the docs and the classifier's own tests run in repo-checks
      # and commit-hygiene, and the M0 parts are skipped when only docs change.
      - name: Require the always-on jobs and every M0 part to be in their expected state
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_PARTS: ${{ needs.changes.outputs.root }}
          HYGIENE_RESULT: ${{ needs.commit-hygiene.result }}
          REPO_CHECKS_RESULT: ${{ needs.repo-checks.result }}
          CORE_RESULT: ${{ needs.m0-core.result }}
          KERNEL_RESULT: ${{ needs.m0-kernel.result }}
          WASM_RESULT: ${{ needs.m0-wasm.result }}
        run: |
          set -euo pipefail
          # Expected result of each needed job:
          #   changes                    success on every event
          #   commit-hygiene, repo-checks  success on pull_request, skipped otherwise
          #   m0-core/kernel/wasm        success when root=true, skipped when root=false
          # Anything else (failure, cancelled, or a skip that should not happen)
          # fails this job. A skip must never pass on its own.
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "changes: $CHANGES_RESULT (expected success); M0 cannot be judged." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            always_on=success
          else
            always_on=skipped
          fi
          if [[ "$RUN_PARTS" == true ]]; then
            part_expected=success
          else
            part_expected=skipped
          fi
          status=0
          check() { # check NAME RESULT EXPECTED
            if [[ "$2" != "$3" ]]; then
              echo "$1: $2 (expected $3; event=$EVENT_NAME, root=$RUN_PARTS)" >&2
              status=1
            else
              echo "$1: $2"
            fi
          }
          check commit-hygiene "$HYGIENE_RESULT" "$always_on"
          check repo-checks "$REPO_CHECKS_RESULT" "$always_on"
          check m0-core "$CORE_RESULT" "$part_expected"
          check m0-kernel "$KERNEL_RESULT" "$part_expected"
          check m0-wasm "$WASM_RESULT" "$part_expected"
          exit "$status"

  workstation:
    name: GoSX workstation and Tymbal boundary
    needs: changes
    if: ${{ needs.changes.outputs.workstation == 'true' }}
    runs-on: ubuntu-24.04
    # The Studio browser suites run in the studio-build and studio-browser jobs.
    timeout-minutes: 45
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The pinned GoSX TinyGo runtime compiler still uses its Go 1.25 lane.
      # Install that SDK separately; do not make TinyGo consume native Go 1.27.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.9'
          cache: false
      - name: Retain the compatible TinyGo SDK
        run: echo "GOSX_TINYGO_GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - uses: ./.github/actions/setup-wasm-tools
      - name: Supported Node for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Framework generation, race checks, and production bundle
        run: |
          set -euo pipefail
          go test -race ./internal/buildaudit ./internal/studiohttp -count=1
          make test-workstation
          (cd workstation && go vet ./...)
          make build-workstation-release
          bash scripts/check-gosx-size.sh --json workstation/dist/build.json > build/workstation-gosx-size.json
          CICADA_SIZE_AUDIT_MANIFEST="$PWD/workstation/dist/build.json" go test -race ./internal/buildaudit -count=1
          git diff --exit-code -- tools/gosx-size
          git diff --exit-code -- workstation/ui
      - name: Windows workstation and desktop
        run: |
          set -euo pipefail
          (cd workstation && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o ../build/cicada-workstation.exe .)
          (cd desktop && go test ./... && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o ../build/cicada-studio.exe .)
      - name: Change classifier matches the workstation module's imports
        run: bash scripts/ci-changes_test.sh --graph-workstation
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gosx-workstation-build
          path: |
            workstation/dist/build.json
            build/workstation-gosx-size.json

  # Builds what the Studio browser suites run against once, so each shard does
  # not rebuild it. The tar keeps file modes (build/cicada stays executable).
  studio-build:
    name: Studio build for the browser shards
    needs: changes
    if: ${{ needs.changes.outputs.studio_browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The pinned GoSX TinyGo runtime compiler still uses its Go 1.25 lane.
      # Install that SDK separately; do not make TinyGo consume native Go 1.27.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.9'
          cache: false
      - name: Retain the compatible TinyGo SDK
        run: echo "GOSX_TINYGO_GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - uses: ./.github/actions/setup-wasm-tools
      - name: Supported Node for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Build the production workstation, Studio, and the kernel WASM
        run: make build-workstation-release build-core build-kernel-wasm
      - name: Pack every file the build created
        run: |
          set -euo pipefail
          # Untracked files, ignored ones included: build/ and workstation/dist/.
          git ls-files --others -z | tar --null --files-from=- -czf "$RUNNER_TEMP/studio-browser-build.tgz"
          ls -l "$RUNNER_TEMP/studio-browser-build.tgz"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: studio-browser-build
          path: ${{ runner.temp }}/studio-browser-build.tgz
          if-no-files-found: error
          # Long enough that rerunning a failed shard days later still finds it.
          retention-days: 5
          compression-level: 0

  # The suites that the single "Studio browser continuity" step ran one after
  # another, in four parallel shards. scripts/ci-studio-browser.sh lists the
  # shards and checks that every suite is in exactly one.
  studio-browser:
    name: Studio browser suites (shard ${{ matrix.shard }}/4)
    needs: [changes, studio-build]
    if: ${{ needs.changes.outputs.studio_browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GOWORK: off
      CHROME_VERSION: 152.0.7977.64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Supported Node for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: studio-browser-build
          path: ${{ runner.temp }}/studio-browser-build
      - name: Unpack the build outputs
        run: tar -xzf "$RUNNER_TEMP/studio-browser-build/studio-browser-build.tgz"
      - name: Shards cover every suite once
        run: bash scripts/ci-studio-browser.sh check
      - name: Studio browser continuity
        shell: bash
        run: bash scripts/ci-studio-browser.sh run ${{ matrix.shard }}
      - name: Save Studio continuity reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: studio-continuity-reports-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            build/studio-continuity-report.txt
            build/studio-modulation-report.txt
            build/modulation-source-proof/
            build/studio-chorus-report.txt
            build/studio-pattern-machine-report.txt
            build/studio-pattern-machine-server.log
            build/pattern-machine-proof/
            build/chorus-proof/
            build/studio-chorus-server.log
            build/studio-shell-report.txt
            build/studio-shell-server.log
            build/studio-mixer-strips-report.txt
            build/studio-mixer-strips-server.log
            build/studio-edits-report.txt
            build/studio-edits-server.log
            build/studio-notes-report.txt
            build/studio-notes-server.log
            build/studio-notes-proof/
            build/studio-column-report.txt
            build/studio-column-server.log
            build/studio-column-proof/
            build/studio-song-*-report.txt
            build/studio-song-*-server.log
            build/studio-song-proof/
            build/studio-portable-fixture.json
            build/studio-portable-notes.mid
            build/studio-portable-pattern.mid
            build/studio-portable-midi-report.json
            build/studio-portable-*-report.txt
            build/studio-portable-*-server.log
            build/studio-portable-proof/
            build/studio-portable-midi-proof/
            build/studio-midi-pickup-report.txt
            build/studio-macro-controls-report.txt
            build/studio-macro-controls-proof/
            build/studio-midi-binding-report.txt
            build/studio-midi-binding-proof/
            build/studio-preset-save-report.txt
            build/studio-preset-save-proof/
            build/studio-code-recovery-*-report.txt
            build/studio-code-recovery-*-server.log
            build/studio-code-recovery-proof/*-report.json
            build/studio-code-recovery-proof/*.png
            build/studio-export-report.txt
            build/studio-export-server.log
            build/studio-export-proof/
            build/studio-stems-report.txt
            build/studio-stems-server.log
            build/studio-stems-proof/
            build/studio-continuity-server.log
            build/studio-collaboration-report.txt
            build/studio-collaboration-server.log
            build/studio-placement-report.txt
            build/studio-placement-server.log
