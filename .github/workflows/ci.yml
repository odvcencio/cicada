  macos-desktop:
    name: macOS desktop (${{ matrix.arch }})
    needs: changes
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.macos_desktop == 'true' }}
    runs-on: ${{ matrix.runner }}
    # Full Studio on arm64; Intel compiles the app and exercises the native
    # host/bridge without rebuilding portable WASM. Neither waits on another job.
    # Both architectures retain the full Studio sweep in the nightly/manual lane.
    # Cold arm64 builds and the signed-app exercise can exceed ten minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    env:
      GOWORK: 'off'
      CGO_ENABLED: '0'
      CICADA_TEST_NATIVE_MIDI: '1'
      CICADA_COREMIDI_TEST: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum
            workstation/go.sum
      - uses: ./.github/actions/setup-wasm-tools
        if: matrix.arch == 'arm64'
        with:
          retry-window-seconds: '60'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - name: Build and sign the exact revision
        if: matrix.arch == 'arm64'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(go env GOWORK)" = off
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          desktop/package.sh --target darwin --version 0.0.0-ci --output build/macos
          codesign --verify --deep --strict 'build/macos/Cicada Studio.app'
          go version -m 'build/macos/Cicada Studio.app/Contents/MacOS/cicada-studio'
          git diff --exit-code -- desktop/go.mod desktop/go.sum workstation/go.mod workstation/go.sum workstation/ui
      - name: Exercise the signed app in WKWebView
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          python3 scripts/check-studio-shutdown.py --cicada 'build/macos/Cicada Studio.app/Contents/MacOS/cicada' --output build/macos-shutdown-proof
          python3 -m unittest discover -s desktop -p 'test*smoke.py'
          (cd desktop && CICADA_TEST_EDITOR_MENU_WORKFLOW="$PWD/../build/native-editor-workflow.js" go test -mod=readonly -trimpath -run '^TestMac(MenusKeepHistoryShortcutsInWorkstation|EditorMenuWorkflow)$' -count=1 .)
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/startup --mode normal --timeout 60 --workflow desktop/testdata/native-startup-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/recording --mode normal --timeout 60 --workflow desktop/testdata/native-recording-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/editor --mode normal --timeout 60 --workflow build/native-editor-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/stems-export --mode normal --download-test --timeout 60 --workflow desktop/testdata/native-stems-export-workflow.js
          CICADA_ELASTIC_ALBUM_FIXTURE="$PWD/build/macos-elastic-album" go test ./cmd/cicada -run '^TestElasticAlbumWorkflow$' -count=1
          # This is a multi-edit audio-reprint workflow, not the separate startup check;
          # unchanged main has taken about 80 seconds on hosted arm64 runners.
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/elastic-automation --mode normal --project-fixture build/macos-elastic-album/anywhere-you-are.cicada --timeout 120 --workflow desktop/testdata/native-elastic-automation-workflow.js
      - name: Compile Intel app components from the exact revision
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = amd64
          mkdir -p build/macos-host
          go -C desktop build -mod=readonly -trimpath -o ../build/macos-host/cicada-studio .
          go build -mod=readonly -trimpath -o build/macos-host/cicada ./cmd/cicada
          go -C workstation build -mod=readonly -trimpath -o ../build/macos-host/cicada-workstation .
          go version -m build/macos-host/cicada-studio
          git diff --exit-code -- desktop/go.mod desktop/go.sum workstation/go.mod workstation/go.sum workstation/ui
      - name: Exercise Intel WKWebView and native export saving
        if: matrix.arch == 'amd64'
        run: |
          python3 -m unittest discover -s desktop -p 'test*smoke.py'
          python3 desktop/host_smoke.py --host build/macos-host/cicada-studio --output build/macos-host-smoke
      - name: Save focused macOS validation reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-desktop-${{ matrix.arch }}-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/macos-smoke/
            build/macos-shutdown-proof/
            build/macos-host-smoke/

  macos-native-contracts:
    name: macOS platform contracts (${{ matrix.arch }})
    needs: changes
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.macos_contracts == 'true' }}
    runs-on: ${{ matrix.runner }}
    # Independent of packaging: both Mac checks start together and are bounded.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    env:
      GOWORK: 'off'
      CGO_ENABLED: '0'
      CICADA_TEST_NATIVE_MIDI: '1'
      CICADA_COREMIDI_TEST: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum
            workstation/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - name: Verify native platform contracts
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          mkdir -p build
          # Match production compilation; broad race/vet coverage stays in Linux
          # PR checks and the exhaustive Mac lane.
          (cd desktop && go test -mod=readonly -trimpath -timeout=90s -count=1 ./...) | tee build/native-desktop.log
          go test -mod=readonly -trimpath -timeout=90s -count=1 ./host/capture ./host/midi ./internal/audiobackend | tee build/native-platform.log
          CICADA_AUDIO_CALLBACK_NOALLOC=1 go test -mod=readonly -trimpath -timeout=90s ./cmd/cicada -run '^Test(StudioNativeCaptureCapabilityCannotBeBypassedBySavedSettings|AudioSetup.*|InputAuthorization.*|MissingInputPermission.*|NativeMIDI.*|StudioAudioRenderCallbackDoesNotAllocate)$' -count=1 | tee build/native-studio.log
      - name: Save native platform reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-platform-${{ matrix.arch }}-reports
          if-no-files-found: warn
          retention-days: 7
          path: build/native-*.log

  macos-desktop-full:
    name: macOS desktop exhaustive (${{ matrix.arch }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    # Allow cold Intel compilation and the complete isolated export/reopen suite.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum
            workstation/go.sum
      - uses: ./.github/actions/setup-wasm-tools
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - name: Verify pinned dependencies and native tests
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          # Connect only the test-created CoreMIDI source; no audio or microphone.
          CICADA_TEST_NATIVE_MIDI: '1'
        run: |
          set -euo pipefail
          test "$(go env GOWORK)" = off
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          go version
          tinygo version
          wasm-opt --version
          go test -race ./internal/buildaudit ./internal/studiohttp -count=1
          (cd desktop && go mod download && go mod verify && go test -race ./... && go vet ./...)
          (cd workstation && go test -race ./... && go vet ./...)
          go test -race ./host/capture ./host/midi ./internal/audiobackend -count=1
          CICADA_COREMIDI_TEST=1 go test -race ./host/midi -run '^TestCoreMIDIInput' -count=1
          go test -race ./cmd/cicada -run '^Test(ApplyRefusesConcurrentSaveAtExchange|StudioLateExternalWriteSurvivesSavesAndRestart|StudioOpenWriterDuringCommitIsRetained|StudioRecoveryWithoutReceiptRefusesSave|RouteGuardsMatchIntentsAndApply|StudioNativeCaptureCapabilityCannotBeBypassedBySavedSettings|AudioSetup.*|InputAuthorization.*|MissingInputPermission.*|NativeMIDI.*|GoSXLive.*)$' -count=1
          CICADA_AUDIO_CALLBACK_NOALLOC=1 go test ./cmd/cicada -run '^TestStudioAudioRenderCallbackDoesNotAllocate$' -count=1
      - name: Verify native audio and WASM determinism
        run: |
          set -euo pipefail
          mkdir -p build
          make test-build-tools
          go test ./kernel/amp ./kernel/dsp/halfband ./kernel/graph ./kernel/modulate ./kernel/voice/ep -count=1 -v | tee build/native-audio-determinism.log
          go test -tags ep_wasm ./kernel/voice/ep -run '^TestEpNativeWASMDeterminism$' -count=1 -v | tee build/ep-wasm-determinism.log
      - name: Verify performed gestures in native and browser audio
        run: |
          set -euo pipefail
          go test ./kernel/seq ./kernel/cmd ./kernel/engine ./host/kernelimage -run 'Performed|Performance|LiveIdentity|LiveGroup|LiveShared|SharedGestures' -count=1 -v | tee build/performed-gesture-native.log
          go test -race ./host/liveplay -run 'LiveGroup' -count=1 -v | tee build/live-shared-audio.log
          go test -race ./cmd/cicada -run '^TestStudio(Gesture|PlayedTake|SharedCapture|ChannelCapture)|^TestGoSXLiveSharedControls' -count=1 -v | tee build/performed-gesture-studio.log
          make build-kernel-wasm
          CICADA_CHORD_WASM_PATH="$PWD/build/cicada-kernel.wasm" go test -timeout=3m -tags chord_wasm ./cmd/cicada-kernel-wasm -run '^TestChordWASM(Per|LiveIdentity|Shared)' -count=1 -v | tee build/performed-gesture-wasm.log
      - name: Package and launch from a clean checkout
        run: |
          set -euo pipefail
          desktop/package.sh --target darwin --version 0.0.0-ci --output build/macos
          python3 scripts/check-studio-shutdown.py --cicada 'build/macos/Cicada Studio.app/Contents/MacOS/cicada' --output build/macos-shutdown-proof
          codesign --verify --deep --strict 'build/macos/Cicada Studio.app'
          bash scripts/check-gosx-size.sh --json 'build/macos/Cicada Studio.app/Contents/MacOS/workstation/build.json' > build/macos-gosx-size.json
          CICADA_SIZE_AUDIT_MANIFEST="$PWD/build/macos/Cicada Studio.app/Contents/MacOS/workstation/build.json" go test -race ./internal/buildaudit -count=1
          git diff --exit-code -- tools/gosx-size
          go version -m 'build/macos/Cicada Studio.app/Contents/MacOS/cicada-studio'
          python3 -m unittest discover -s desktop -p test_smoke.py
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/startup --mode normal --workflow desktop/testdata/native-startup-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/recording --mode normal --workflow desktop/testdata/native-recording-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/import --mode normal --workflow desktop/testdata/native-import-workflow.js
          cat desktop/testdata/native-sampler-waveform-prefix.js desktop/testdata/native-import-workflow.js > build/native-sampler-waveform-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/sampler-waveform --mode normal --timeout 120 --workflow build/native-sampler-waveform-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/arrange --mode normal --timeout 120 --workflow desktop/testdata/native-arrange-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/precision --mode normal --timeout 180 --workflow desktop/testdata/native-placement-precision-workflow.js
          (cd desktop && CICADA_TEST_EDITOR_MENU_WORKFLOW="$PWD/../build/native-editor-workflow.js" go test -mod=readonly -run 'TestMacMenusKeepHistoryShortcutsInWorkstation|TestMacEditorMenuWorkflow' -count=1 .)
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/editor --mode normal --timeout 120 --workflow build/native-editor-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/code-recovery --mode code-recovery --timeout 120
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/cancellation --mode normal --workflow desktop/testdata/native-cancellation-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/sounds --mode normal --timeout 120 --workflow desktop/testdata/native-sounds-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/shared-capture --mode normal --timeout 120 --workflow desktop/testdata/native-shared-capture-workflow.js
          python3 -c "from pathlib import Path; Path('build/native-channel-capture-workflow.js').write_text('window.__cicadaChannelCapture=true;\n'+Path('desktop/testdata/native-shared-capture-workflow.js').read_text())"
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/channel-capture --mode normal --timeout 120 --workflow build/native-channel-capture-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/dock-fit --mode normal --timeout 120 --workflow desktop/testdata/native-dock-fit-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/columns --mode normal --timeout 120 --workflow desktop/testdata/native-columns-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/export --mode normal --timeout 120 --workflow desktop/testdata/native-export-workflow.js
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/stems-export --mode normal --download-test --timeout 150 --workflow desktop/testdata/native-stems-export-workflow.js
          go -C workstation run ./browser/testdata/portable-song > build/native-portable-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/portable --mode normal --timeout 120 --portable-fixture build/native-portable-fixture.json
          node workstation/browser/arrangement-sources.test.cjs --write-fixture build/native-arrangement-sources > build/native-arrangement-sources-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/arrangement-sources --mode normal --timeout 120 --project-fixture build/native-arrangement-sources/main.cicada --workflow desktop/testdata/native-arrangement-sources-workflow.js
          node workstation/browser/tempo-editor.test.cjs --write-fixture build/native-tempo-editor --primary > build/native-tempo-editor-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/tempo-editor --mode normal --timeout 180 --project-fixture build/native-tempo-editor/main.cicada --workflow desktop/testdata/native-tempo-editor-workflow.js
          node workstation/browser/solo-clock.test.cjs --write-fixture build/native-solo-clock/main.cicada
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/solo-clock --mode normal --timeout 180 --project-fixture build/native-solo-clock/main.cicada --workflow desktop/testdata/native-solo-clock-workflow.js
          go -C workstation run ./browser/testdata/print-sources --primary-arrangement > build/native-observation-clock-fixture.json
          observation_score="$(node -e 'process.stdout.write(require("./build/native-observation-clock-fixture.json").score)')"
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/observation-clock --mode normal --timeout 180 --project-fixture "$observation_score" --workflow desktop/testdata/native-observation-clock-workflow.js
          node workstation/browser/tempo-clock.test.cjs --write-fixture build/native-tempo-clock/main.cicada
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/tempo-clock --mode normal --timeout 180 --project-fixture build/native-tempo-clock/main.cicada --workflow desktop/testdata/native-tempo-clock-workflow.js
          node workstation/browser/library-recording.test.cjs --write-fixture build/native-library-recording/main.cicada
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/library-recording --mode normal --timeout 180 --project-fixture build/native-library-recording/main.cicada --workflow desktop/testdata/native-library-recording-workflow.js
          for song_layout in scene placement; do
            song_args=()
            if [[ "$song_layout" == placement ]]; then song_args+=(--placement); fi
            # macOS Bash 3.2 treats an empty array as unset under nounset.
            node workstation/browser/pattern-song.test.cjs --write-fixture "build/native-pattern-song-$song_layout/main.cicada" ${song_args[@]+"${song_args[@]}"}
            python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output "build/macos-smoke/pattern-song-$song_layout" --mode normal --timeout 180 --project-fixture "build/native-pattern-song-$song_layout/main.cicada" --workflow desktop/testdata/native-pattern-song-workflow.js
          done
          node workstation/browser/pattern-grid.test.cjs --write-fixture build/native-pattern-grid/main.cicada
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/pattern-grid --mode normal --timeout 180 --project-fixture build/native-pattern-grid/main.cicada --workflow desktop/testdata/native-pattern-grid-workflow.js
          go -C workstation run ./browser/testdata/placement-variation "$PWD/build/native-placement-variation" > build/native-placement-variation-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/placement-variation --mode normal --timeout 180 --project-fixture build/native-placement-variation/main.cicada --workflow desktop/testdata/native-placement-variation-workflow.js
          node workstation/browser/performance-time.test.cjs --write-fixture build/native-performance-time > build/native-performance-time-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/performance-time --mode normal --timeout 240 --project-fixture build/native-performance-time/main.cicada --workflow desktop/testdata/native-performance-time-workflow.js
          go -C workstation run ./browser/testdata/direct-variation "$PWD/build/native-direct-variation" > build/native-direct-variation-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/direct-variation --mode normal --timeout 300 --project-fixture build/native-direct-variation/main.cicada --workflow desktop/testdata/native-direct-variation-workflow.js
          node workstation/browser/sound-context.test.cjs --write-fixture build/native-sound-context > build/native-sound-context-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/sound-context --mode normal --timeout 240 --project-fixture build/native-sound-context/main.cicada --workflow desktop/testdata/native-sound-context-workflow.js
          node workstation/browser/performance-pitch.test.cjs --write-fixture build/native-performance-pitch > build/native-performance-pitch-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/performance-pitch --mode normal --timeout 240 --project-fixture build/native-performance-pitch/main.cicada --workflow desktop/testdata/native-performance-pitch-workflow.js
          node workstation/browser/performance-sources.test.cjs --write-fixture build/native-performance-sources > build/native-performance-sources-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/performance-sources --mode normal --timeout 300 --project-fixture build/native-performance-sources/main.cicada --workflow desktop/testdata/native-performance-sources-workflow.js
          node workstation/browser/recording-sources.test.cjs --write-fixture build/native-recording-sources > build/native-recording-sources-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/recording-sources --mode normal --timeout 300 --project-fixture build/native-recording-sources/main.cicada --workflow desktop/testdata/native-recording-sources-workflow.js
          node workstation/browser/grid-sources.test.cjs --write-fixture build/native-grid-sources > build/native-grid-sources-fixture.json
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/grid-sources --mode normal --timeout 300 --project-fixture build/native-grid-sources/main.cicada --workflow desktop/testdata/native-grid-sources-workflow.js
          go -C workstation run ./browser/testdata/print-sources --sampler-bank > build/native-print-sources-fixture.json
          print_score="$(node -e 'process.stdout.write(require("./build/native-print-sources-fixture.json").score)')"
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/print-sources --mode normal --timeout 180 --project-fixture "$print_score" --workflow desktop/testdata/native-print-sources-workflow.js
          go -C workstation run ./browser/testdata/print-sources --scene-song --sampler-bank > build/native-song-sources-fixture.json
          song_score="$(node -e 'process.stdout.write(require("./build/native-song-sources-fixture.json").score)')"
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/song-sources --mode normal --timeout 180 --project-fixture "$song_score" --workflow desktop/testdata/native-print-sources-workflow.js
          go -C workstation run ./browser/testdata/print-sources --scene-controls --sampler-bank > build/native-scene-controls-fixture.json
          controls_score="$(node -e 'process.stdout.write(require("./build/native-scene-controls-fixture.json").score)')"
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/scene-controls --mode normal --timeout 180 --project-fixture "$controls_score" --workflow desktop/testdata/native-print-sources-workflow.js
          go -C workstation run ./browser/testdata/print-sources --scene-tempo --sampler-bank > build/native-scene-tempo-fixture.json
          tempo_score="$(node -e 'process.stdout.write(require("./build/native-scene-tempo-fixture.json").score)')"
          python3 -c "from pathlib import Path; import base64,json; Path('build/native-tempo-workflow.js').write_text('window.__cicadaPortableKernelBase64='+json.dumps(base64.b64encode(Path('build/cicada-kernel.wasm').read_bytes()).decode())+';\n'+Path('desktop/testdata/native-print-sources-workflow.js').read_text())"
          python3 desktop/smoke.py --app 'build/macos/Cicada Studio.app' --output build/macos-smoke/scene-tempo --mode normal --timeout 180 --project-fixture "$tempo_score" --workflow build/native-tempo-workflow.js
          git diff --exit-code -- desktop/go.mod desktop/go.sum workstation/go.mod workstation/go.sum workstation/ui
          ditto -c -k --sequesterRsrc --keepParent 'build/macos/Cicada Studio.app' 'build/macos-smoke/Cicada-Studio-${{ matrix.arch }}.zip'
      - name: Save macOS validation reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-desktop-${{ matrix.arch }}-reports
          if-no-files-found: warn
          path: |
            build/macos-smoke/
            build/macos-shutdown-proof/
            build/macos-gosx-size.json
            build/native-audio-determinism.log
            build/ep-wasm-determinism.log
            build/performed-gesture-native.log
            build/live-shared-audio.log
            build/performed-gesture-studio.log
            build/performed-gesture-wasm.log

  # The audio WASM tests (make test-wasm) have no CPU budget, so they run on
  # hosted runners in parallel with the browser gates on the reference machine.
  # Together the two jobs run the same tests as `make test-wasm`: this one skips
  # the one-hour memory test and m2-wasm-memory runs only that test.
  m2-wasm-parity:
    name: M2 audio WASM parity (all but the one-hour memory test)
    needs: changes
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.m2 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-wasm-tools
      - name: Supported Node for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Audio WASM tests and chord tests
        run: make test-wasm TEST_WASM_SKIP='^TestAudioWASMMemoryStableForOneHour$'
      - name: Save M2 WASM reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m2-wasm-parity-reports
          if-no-files-found: warn
          path: |
            build/test-wasm.log
            build/test-chord-wasm.log
            build/chord-wasm-report.txt

  m2-wasm-memory:
    name: M2 audio WASM one-hour memory test
    needs: changes
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.m2 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-wasm-tools
      - name: One-hour memory test
        run: |
          set -euo pipefail
          make build-kernel-wasm build-vocals-wasm test-wasm-audio TEST_WASM_RUN='^TestAudioWASMMemoryStableForOneHour$' TEST_WASM_LOG=build/test-wasm-memory.log
          # go test exits 0 when -run matches nothing, for example after a rename.
          grep -q -- '--- PASS: TestAudioWASMMemoryStableForOneHour' build/test-wasm-memory.log
      - name: Save M2 WASM reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m2-wasm-memory-reports
          if-no-files-found: warn
          path: build/test-wasm-memory.log

  m2-browser:
    name: M2 AudioWorklet browser tests
    needs: changes
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.changes.outputs.m2 == 'true' }}
    # The AudioWorklet's functional browser tests, the WASM size gate and the
    # WAM2 host. None of them times anything against a budget, so they run on
    # hosted runners, beside other work, and never wait for the reference
    # machine. Only the CPU gate (m2-pr below) needs that machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOWORK: off
      CHROME_VERSION: 152.0.7977.64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-wasm-tools
      # The runner's system Node is too old for the demo browser test, which
      # needs the global WebSocket that Node 22 provides.
      - name: Supported Node for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Cache pinned Chrome for Testing headless shell
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TOOL_CACHE/chrome-for-testing/$CHROME_VERSION/linux64"
          browser_path="$tool_root/chrome-headless-shell-linux64/chrome-headless-shell"
          if [[ ! -x "$browser_path" ]]; then
            mkdir -p "$tool_root"
            temp_dir="$(mktemp -d "$RUNNER_TEMP/chrome-for-testing.XXXXXX")"
            trap 'rm -rf "$temp_dir"' EXIT
            archive="$temp_dir/chrome-headless-shell.zip"
            curl --fail --location --retry 3 --output "$archive" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip"
            unzip -q "$archive" -d "$temp_dir"
            mv "$temp_dir/chrome-headless-shell-linux64" "$tool_root/"
          fi
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
          PULSE_SERVER=unix:/nonexistent "$browser_path" --mute-audio --version
          go version
          tinygo version
          node --version
      - name: M2 browser tests and size gate
        # build-worklets first: the browser tests and the size gate must use a
        # worklet built from the current processor.js.
        run: make build-worklets test-browser test-demo-browser budget-size
      - name: WAM2 export and reference host
        env:
          CICADA_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/cicada-wam2-evidence
        run: make test-wam2
      - name: Save WAM2 GUI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wam2-gui-evidence
          if-no-files-found: error
          path: ${{ runner.temp }}/cicada-wam2-evidence/*.png
      - name: Save M2 browser reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m2-audioworklet-browser-reports
          if-no-files-found: warn
          path: |
            build/test-browser.log
            build/test-worklet-stall.log
            build/budget-size-report.txt
            build/m2-browser-chrome.log
            build/demo-evidence/

  m2-pr:
    name: M2 AudioWorklet gates
    needs: changes
    # Only changes that can move the CPU gate's result queue it (m2_gates in
    # scripts/ci-changes.sh); pushes to main always run it.
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.m2_gates == 'true' }}
    # This job runs on the self-hosted reference machine, so a pull request from
    # a fork must not run it. The machine has one runner: every queued run waits
    # for the one before it, so this job holds only the CPU budget, which a
    # hosted runner cannot measure (it measured 1.296 ms against 0.67 ms).
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    env:
      GOWORK: off
      CHROME_VERSION: 152.0.7977.64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-wasm-tools
      # The runner's system Node is too old for the demo browser test, which
      # needs the global WebSocket that Node 22 provides.
      - name: Supported Node for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Cache pinned Chrome for Testing headless shell
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TOOL_CACHE/chrome-for-testing/$CHROME_VERSION/linux64"
          browser_path="$tool_root/chrome-headless-shell-linux64/chrome-headless-shell"
          if [[ ! -x "$browser_path" ]]; then
            mkdir -p "$tool_root"
            temp_dir="$(mktemp -d "$RUNNER_TEMP/chrome-for-testing.XXXXXX")"
            trap 'rm -rf "$temp_dir"' EXIT
            archive="$temp_dir/chrome-headless-shell.zip"
            curl --fail --location --retry 3 --output "$archive" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip"
            unzip -q "$archive" -d "$temp_dir"
            mv "$temp_dir/chrome-headless-shell-linux64" "$tool_root/"
          fi
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
          PULSE_SERVER=unix:/nonexistent "$browser_path" --mute-audio --version
          go version
          tinygo version
          node --version
      - name: M2 CPU budget
        # The browser tests, the size gate and WAM2 moved to m2-browser on hosted
        # runners; the parity and memory tests are in m2-wasm-parity and
        # m2-wasm-memory. build-worklets first, so the gate measures a worklet
        # built from the current processor.js.
        run: make build-worklets build-kernel-wasm budget-browser
      - name: Save M2 gate reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m2-audioworklet-gate-reports
          if-no-files-found: warn
          path: |
            build/budget-browser.log
            build/browser-cpu-report.json

  m2-soak:
    name: M2 AudioWorklet nightly soak
    # A manual run asks for it with the soak input; otherwise every dispatch
    # (for the macOS or other dispatch-only jobs) would hold the reference
    # machine for about 35 minutes and queue every pull request's CPU gate.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.soak)
    # Its CPU gate (0.67 ms per callback) is measured on the reference machine.
    # A hosted runner measured 1.296 ms, so this job stays on the self-hosted one.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 55
    env:
      GOWORK: off
      CHROME_VERSION: 152.0.7977.64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/setup-wasm-tools
      - name: Supported Node for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Cache pinned Chrome for Testing headless shell
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TOOL_CACHE/chrome-for-testing/$CHROME_VERSION/linux64"
          browser_path="$tool_root/chrome-headless-shell-linux64/chrome-headless-shell"
          if [[ ! -x "$browser_path" ]]; then
            mkdir -p "$tool_root"
            temp_dir="$(mktemp -d "$RUNNER_TEMP/chrome-for-testing.XXXXXX")"
            trap 'rm -rf "$temp_dir"' EXIT
            archive="$temp_dir/chrome-headless-shell.zip"
            curl --fail --location --retry 3 --output "$archive" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip"
            unzip -q "$archive" -d "$temp_dir"
            mv "$temp_dir/chrome-headless-shell-linux64" "$tool_root/"
          fi
          echo "CHROME_BIN=$browser_path" >> "$GITHUB_ENV"
          PULSE_SERVER=unix:/nonexistent "$browser_path" --mute-audio --version
          go version
          tinygo version
          node --version
      - name: Run full 30-minute browser soak
        run: make test-browser-soak
      - name: Save M2 soak report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m2-audioworklet-soak-report
          if-no-files-found: warn
          path: |
            build/browser-soak.log
            build/browser-soak-report.json
            build/demo-soak-report.json
            build/demo-evidence/
            build/browser-cpu-report.json
            build/m2-browser-chrome.log
